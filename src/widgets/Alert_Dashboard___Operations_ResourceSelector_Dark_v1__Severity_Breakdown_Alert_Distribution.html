<style>
.aa-root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#14171b;color:#e8eaed;padding:10px 12px;box-sizing:border-box;height:100%;overflow:auto;}
.aa-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:12px;}
.aa-title{font-size:13px;font-weight:700;color:#d1d5db;letter-spacing:.03em;text-transform:uppercase;}
.aa-meta{font-size:11px;color:#8b949e;}
.aa-warn{font-size:11px;color:#f5ca1d;margin:0 0 8px;}
.aa-err{font-size:12px;color:#ff8a80;background:#3b1d1d;border:1px solid #7f2a2a;padding:8px 10px;border-radius:4px;}
.aa-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.aa-card{border-radius:4px;padding:14px 16px;border:1px solid #3a3f46;min-height:72px;display:flex;flex-direction:column;justify-content:center;}
.aa-card .lbl{font-size:12px;font-weight:600;opacity:.9;margin-bottom:6px;}
.aa-card .val{font-size:28px;font-weight:700;line-height:1;}
.aa-total{background:#f3f4f6;color:#111827;border-color:#d1d5db;}
.aa-crit{background:#e0351b;color:#fff;}
.aa-errc{background:#ff8c00;color:#111;}
.aa-warnc{background:#f5ca1d;color:#111;}
.aa-charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.aa-panel{background:#1b1f24;border:1px solid #3a3f46;border-radius:4px;padding:10px 12px;min-height:220px;}
.aa-panel h3{margin:0 0 8px;font-size:12px;font-weight:700;color:#c8cdd3;text-transform:uppercase;letter-spacing:.03em;}
.aa-panel-body{display:flex;gap:10px;align-items:center;justify-content:center;min-height:180px;}
.aa-legend{list-style:none;margin:0;padding:0;font-size:11px;color:#c8cdd3;}
.aa-legend li{display:flex;align-items:center;gap:6px;margin:4px 0;}
.aa-swatch{width:10px;height:10px;border-radius:2px;flex:0 0 auto;}
.aa-bars{width:100%;}
.aa-bar-row{display:grid;grid-template-columns:110px 1fr 36px;gap:6px;align-items:center;margin:5px 0;font-size:11px;}
.aa-bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c8cdd3;}
.aa-bar-track{background:#2a2f36;height:12px;border-radius:2px;overflow:hidden;}
.aa-bar-fill{height:100%;background:#ff8c00;border-radius:2px;}
.aa-bar-n{text-align:right;color:#9aa3ad;}
.aa-empty{color:#8b949e;font-size:12px;text-align:center;padding:24px 8px;}
.aa-loading{color:#8b949e;font-size:12px;padding:20px;text-align:center;}
@media(max-width:1100px){.aa-charts{grid-template-columns:1fr;}.aa-kpis{grid-template-columns:repeat(2,1fr);}}
</style><div class="aa-root" id="aaRoot"><div class="aa-head"><div class="aa-title">Severity Breakdown</div><div class="aa-meta" id="aaMeta">Loading&hellip;</div></div><div id="aaTruncWarn" class="aa-warn" style="display:none;"><br></div><div id="aaError" class="aa-err" style="display:none;"><br></div><div class="aa-kpis" id="aaKpis"><div class="aa-card aa-total"><div class="lbl">Total Active Alerts</div><div class="val" id="aaTotal">&mdash;</div></div><div class="aa-card aa-crit"><div class="lbl">Critical</div><div class="val" id="aaCrit">&mdash;</div></div><div class="aa-card aa-errc"><div class="lbl">Error</div><div class="val" id="aaErrorCnt">&mdash;</div></div><div class="aa-card aa-warnc"><div class="lbl">Warning</div><div class="val" id="aaWarn">&mdash;</div></div></div><div class="aa-title" style="margin:4px 0 8px;">Alert Distribution</div><div class="aa-charts"><div class="aa-panel"><h3>Severity Distribution</h3><div class="aa-panel-body" id="aaDonut"><br></div></div><div class="aa-panel"><h3>Top Alert Sources</h3><div class="aa-panel-body" id="aaSources"><br></div></div><div class="aa-panel"><h3>Top Resources by Alert Count</h3><div class="aa-panel-body" id="aaResources"><br></div></div></div></div><script>
(function () {
  const CACHE_KEY = 'lmAlertDashAnalytics_v1';
  const CACHE_TTL_MS = 45000;
  const PAGE_SIZE = 1000;
  const MAX_OFFSET = 10000;
  const MAX_RECORDS = 10000;
  const REFRESH_MS = 60000;
  const SEV = { critical: 4, error: 3, warn: 2 };
  const SEV_COLORS = { critical: '#e0351b', error: '#ff8c00', warn: '#f5ca1d' };
  const SEV_LABELS = { critical: 'Critical', error: 'Error', warn: 'Warning' };

  let csrfToken = null;
  let csrfFetchedAt = 0;
  const CSRF_TTL = 4 * 60 * 1000;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function parseFiltersFromURL() {
    try {
      const loc = (parent && parent.window && parent.window.location) ? parent.window.location : window.location;
      const params = new URLSearchParams(loc.search);
      const raw = params.get('filters');
      if (!raw) return [];
      const parsed = JSON.parse(decodeURIComponent(raw));
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function selectedValues(filterEntry) {
    if (!filterEntry || !Array.isArray(filterEntry.v)) return [];
    return filterEntry.v
      .filter(function (x) { return x && (x.isSelected !== false); })
      .map(function (x) { return String(x.value == null ? '' : x.value); })
      .filter(function (v) { return v && v !== '*'; });
  }

  function stripGlob(v) {
    return String(v).replace(/\*+$/, '');
  }

  function isAllOrEmpty(vals) {
    return !vals || !vals.length || vals.every(function (v) { return v === '*' || v === ''; });
  }

  async function fetchCsrf() {
    const now = Date.now();
    if (csrfToken && (now - csrfFetchedAt) < CSRF_TTL) return csrfToken;
    const resp = await fetch('/santaba/rest/functions/dummy', {
      method: 'GET',
      credentials: 'include',
      headers: { 'X-Csrf-Token': 'Fetch', 'X-Version': '3', 'Accept': 'application/json' }
    });
    csrfToken = resp.headers.get('X-Csrf-Token') || resp.headers.get('x-csrf-token');
    csrfFetchedAt = now;
    if (!csrfToken) throw new Error('Unable to obtain CSRF token');
    return csrfToken;
  }

  async function lmGet(pathWithQuery) {
    const token = await fetchCsrf();
    const resp = await fetch('/santaba/rest' + pathWithQuery, {
      method: 'GET',
      credentials: 'include',
      headers: {
        'X-Csrf-Token': token,
        'X-Version': '3',
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      }
    });
    if (!resp.ok) {
      const t = await resp.text().catch(function () { return ''; });
      throw new Error('API ' + resp.status + ' for ' + pathWithQuery.split('?')[0] + (t ? ': ' + t.slice(0, 180) : ''));
    }
    return resp.json();
  }

  function propFilterClause(propName, values, systemProp) {
    const parts = [];
    values.forEach(function (v) {
      const clean = stripGlob(v);
      if (!clean || clean === '*' || String(clean).toLowerCase() === 'all') return;
      const key = systemProp ? 'systemProperties' : 'customProperties';
      // system.categories is multi-value — use contains (~) + *token*
      // Exact ":" on a single category (e.g. Aruba) caused API 400 / bad results.
      const useContains = (propName === 'system.categories');
      const op = useContains ? '~' : ':';
      const value = useContains ? ('*' + String(clean).replace(/\*/g, '') + '*') : clean;
      const obj = JSON.stringify({ name: propName, value: value }).replace(/"/g, '\\"');
      parts.push(key + op + '"' + obj + '"');
    });
    return parts;
  }

  async function resolveDeviceNames(urlFilters) {
    const byProp = {};
    urlFilters.forEach(function (f) {
      if (!f || !f.n) return;
      byProp[f.n] = selectedValues(f).map(stripGlob);
    });

    const displayNames = (byProp['system.displayname'] || []).filter(function (v) { return v && v !== '*'; });
    const metaProps = [
      { n: 'system.categories', system: true },
      { n: 'customer', system: false },
      { n: 'department', system: false },
      { n: 'device_type', system: false },
      { n: 'location', system: false }
    ];

    const clauses = [];
    metaProps.forEach(function (p) {
      const vals = byProp[p.n] || [];
      if (!isAllOrEmpty(vals)) {
        const pcs = propFilterClause(p.n, vals, p.system);
        if (pcs.length) clauses.push(pcs.length === 1 ? pcs[0] : ('(' + pcs.join(' || ') + ')'));
      }
    });

    if (!clauses.length && !displayNames.length) {
      return { names: null, forcedNames: displayNames.length ? displayNames : null };
    }

    if (displayNames.length && !clauses.length) {
      return { names: displayNames, forcedNames: displayNames };
    }

    const filter = clauses.join(',');
    const names = new Set(displayNames);
    let offset = 0;
    let total = Infinity;
    while (offset < total && offset < MAX_OFFSET) {
      const q = '/device/devices?size=' + PAGE_SIZE + '&offset=' + offset +
        '&fields=id,name,displayName,systemProperties,customProperties' +
        (filter ? '&filter=' + encodeURIComponent(filter) : '');
      const data = await lmGet(q);
      const items = (data && data.data && data.data.items) || (data && data.items) || [];
      total = (data && data.data && typeof data.data.total === 'number') ? data.data.total
        : (typeof data.total === 'number' ? data.total : items.length);
      items.forEach(function (d) {
        if (d.displayName) names.add(d.displayName);
        if (d.name) names.add(d.name);
      });
      if (!items.length) break;
      offset += items.length;
      if (items.length < PAGE_SIZE) break;
    }

    if (displayNames.length) {
      const allowed = new Set(displayNames);
      const intersect = [];
      names.forEach(function (n) { if (allowed.has(n)) intersect.push(n); });
      // If metadata narrowed the set, use intersection; if devices API returned none matching display filter, use displayNames only when no meta
      if (clauses.length) return { names: intersect.length ? intersect : Array.from(names), forcedNames: displayNames };
    }
    return { names: Array.from(names), forcedNames: displayNames.length ? displayNames : null };
  }

  function buildAlertFilter(urlFilters, deviceNames) {
    const parts = ['cleared:false', 'sdted:false', 'severity:"4"|"3"|"2"'];
    const byProp = {};
    urlFilters.forEach(function (f) {
      if (f && f.n) byProp[f.n] = selectedValues(f).map(stripGlob);
    });

    const groups = (byProp['system.groups'] || []).filter(function (v) { return v && v !== '*'; });
    if (groups.length) {
      const gvals = groups.map(function (g) {
        const base = stripGlob(g);
        return base.endsWith('*') ? base : (base + '*');
      }).join('|');
      parts.push('monitorObjectGroups:"' + gvals.replace(/"/g, '') + '"');
    }

    if (deviceNames && deviceNames.length) {
      if (deviceNames.length === 1) {
        parts.push('monitorObjectName:"' + deviceNames[0].replace(/"/g, '') + '"');
      } else if (deviceNames.length <= 20) {
        parts.push('monitorObjectName:"' + deviceNames.map(function (n) { return n.replace(/"/g, ''); }).join('|') + '"');
      }
      // if many names, fetch broadly and filter client-side
    }
    return parts.join(',');
  }

  function normalizeSeverity(a) {
    const s = a.severity;
    if (s === 4 || s === '4' || s === 'critical') return 'critical';
    if (s === 3 || s === '3' || s === 'error') return 'error';
    if (s === 2 || s === '2' || s === 'warn' || s === 'warning') return 'warn';
    return null;
  }

  async function fetchAllAlerts(filter, nameAllowSet) {
    const alerts = [];
    let offset = 0;
    let total = Infinity;
    let truncated = false;
    while (offset < total && offset < MAX_OFFSET && alerts.length < MAX_RECORDS) {
      const q = '/alert/alerts?size=' + PAGE_SIZE + '&offset=' + offset +
        '&sort=-startEpoch&filter=' + encodeURIComponent(filter) +
        '&fields=id,severity,cleared,sdted,acked,monitorObjectName,resourceTemplateName,instanceName,dataPointName,startEpoch';
      const data = await lmGet(q);
      const items = (data && data.data && data.data.items) || (data && data.items) || [];
      total = (data && data.data && typeof data.data.total === 'number') ? data.data.total
        : (typeof data.total === 'number' ? data.total : offset + items.length);
      items.forEach(function (a) {
        if (nameAllowSet && nameAllowSet.size) {
          const n = a.monitorObjectName || '';
          if (!nameAllowSet.has(n)) return;
        }
        const sev = normalizeSeverity(a);
        if (!sev) return;
        alerts.push({
          severity: sev,
          monitorObjectName: a.monitorObjectName || 'Unknown',
          resourceTemplateName: a.resourceTemplateName || a.instanceName || 'Unknown'
        });
      });
      if (!items.length) break;
      offset += items.length;
      if (items.length < PAGE_SIZE) break;
      if (offset >= MAX_OFFSET || alerts.length >= MAX_RECORDS) {
        truncated = true;
        break;
      }
    }
    if (total > MAX_RECORDS || total > MAX_OFFSET) truncated = true;
    return { alerts: alerts, truncated: truncated, reportedTotal: total };
  }

  function aggregate(alerts) {
    const counts = { critical: 0, error: 0, warn: 0 };
    const sources = {};
    const resources = {};
    alerts.forEach(function (a) {
      counts[a.severity] = (counts[a.severity] || 0) + 1;
      sources[a.resourceTemplateName] = (sources[a.resourceTemplateName] || 0) + 1;
      resources[a.monitorObjectName] = (resources[a.monitorObjectName] || 0) + 1;
    });
    const total = counts.critical + counts.error + counts.warn;
    function topN(map, n) {
      return Object.keys(map).map(function (k) { return { name: k, count: map[k] }; })
        .sort(function (a, b) { return b.count - a.count; })
        .slice(0, n);
    }
    function topWithOther(map, n) {
      const sorted = Object.keys(map).map(function (k) { return { name: k, count: map[k] }; })
        .sort(function (a, b) { return b.count - a.count; });
      const head = sorted.slice(0, n);
      const rest = sorted.slice(n);
      const other = rest.reduce(function (s, x) { return s + x.count; }, 0);
      if (other > 0) head.push({ name: 'Other', count: other });
      return head;
    }
    return {
      total: total,
      counts: counts,
      sources: topWithOther(sources, 8),
      resources: topN(resources, 10)
    };
  }

  function donutSvg(counts, total) {
    if (!total) return '<div class="aa-empty">No active alerts for the current filters</div>';
    const order = ['critical', 'error', 'warn'];
    const r = 42;
    const c = 2 * Math.PI * r;
    let offset = c * 0.25;
    let arcs = '';
    order.forEach(function (k) {
      const n = counts[k] || 0;
      if (!n) return;
      const len = (n / total) * c;
      arcs += '<circle cx="60" cy="60" r="' + r + '" fill="transparent" stroke="' + SEV_COLORS[k] +
        '" stroke-width="16" stroke-dasharray="' + len + ' ' + (c - len) +
        '" stroke-dashoffset="' + offset + '"></circle>';
      offset -= len;
    });
    const legend = order.map(function (k) {
      const n = counts[k] || 0;
      const pct = total ? ((n / total) * 100).toFixed(1) : '0.0';
      return '<li><span class="aa-swatch" style="background:' + SEV_COLORS[k] + '"></span>' +
        esc(SEV_LABELS[k]) + ' — ' + n + ' (' + pct + '%)</li>';
    }).join('');
    return '<svg viewBox="0 0 120 120" width="140" height="140" aria-label="Severity distribution">' +
      '<circle cx="60" cy="60" r="' + r + '" fill="transparent" stroke="#2a2f36" stroke-width="16"></circle>' +
      arcs +
      '<text x="60" y="56" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">' + total + '</text>' +
      '<text x="60" y="72" text-anchor="middle" fill="#9aa3ad" font-size="9">TOTAL</text></svg>' +
      '<ul class="aa-legend">' + legend + '</ul>';
  }

  function pieLikeBars(items, color) {
    if (!items.length) return '<div class="aa-empty">No data</div>';
    const max = Math.max.apply(null, items.map(function (x) { return x.count; })) || 1;
    return '<div class="aa-bars">' + items.map(function (x) {
      const pct = Math.max(2, Math.round((x.count / max) * 100));
      return '<div class="aa-bar-row" title="' + esc(x.name) + ': ' + x.count + '">' +
        '<div class="aa-bar-label">' + esc(x.name) + '</div>' +
        '<div class="aa-bar-track"><div class="aa-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<div class="aa-bar-n">' + x.count + '</div></div>';
    }).join('') + '</div>';
  }

  function render(agg, meta) {
    document.getElementById('aaTotal').textContent = String(agg.total);
    document.getElementById('aaCrit').textContent = String(agg.counts.critical || 0);
    document.getElementById('aaErrorCnt').textContent = String(agg.counts.error || 0);
    document.getElementById('aaWarn').textContent = String(agg.counts.warn || 0);
    document.getElementById('aaDonut').innerHTML = donutSvg(agg.counts, agg.total);
    document.getElementById('aaSources').innerHTML = pieLikeBars(agg.sources, '#2f81f7');
    document.getElementById('aaResources').innerHTML = pieLikeBars(agg.resources, '#ff8c00');
    document.getElementById('aaMeta').textContent = meta;
    const tw = document.getElementById('aaTruncWarn');
    if (meta.indexOf('truncated') >= 0) {
      tw.style.display = 'block';
      tw.textContent = 'Results truncated at API pagination limit; counts may be incomplete.';
    } else {
      tw.style.display = 'none';
    }
  }

  function setError(msg) {
    const el = document.getElementById('aaError');
    el.style.display = 'block';
    el.textContent = msg;
    document.getElementById('aaTotal').textContent = '0';
    document.getElementById('aaCrit').textContent = '0';
    document.getElementById('aaErrorCnt').textContent = '0';
    document.getElementById('aaWarn').textContent = '0';
  }

  function clearError() {
    const el = document.getElementById('aaError');
    el.style.display = 'none';
    el.textContent = '';
  }

  async function load(force) {
    clearError();
    document.getElementById('aaMeta').textContent = 'Refreshing…';
    try {
      const urlFilters = parseFiltersFromURL();
      const cacheKey = CACHE_KEY + ':' + JSON.stringify(urlFilters);
      if (!force) {
        try {
          const raw = sessionStorage.getItem(cacheKey);
          if (raw) {
            const cached = JSON.parse(raw);
            if (cached && cached.ts && (Date.now() - cached.ts) < CACHE_TTL_MS) {
              render(cached.agg, 'Cached · last refresh ' + new Date(cached.ts).toLocaleTimeString() + (cached.truncated ? ' · truncated' : ''));
              return;
            }
          }
        } catch (e) { /* ignore cache */ }
      }

      const resolved = await resolveDeviceNames(urlFilters);
      let nameAllowSet = null;
      if (resolved.names && resolved.names.length) {
        nameAllowSet = new Set(resolved.names);
      }
      // Many device names: do not put all in API filter; filter client-side
      const apiNames = (resolved.names && resolved.names.length && resolved.names.length <= 20) ? resolved.names : null;
      const filter = buildAlertFilter(urlFilters, apiNames);
      const result = await fetchAllAlerts(filter, (apiNames ? null : nameAllowSet));
      const agg = aggregate(result.alerts);
      const ts = Date.now();
      try {
        sessionStorage.setItem(cacheKey, JSON.stringify({ ts: ts, agg: agg, truncated: result.truncated }));
      } catch (e) { /* quota */ }
      const meta = 'Last refresh ' + new Date(ts).toLocaleTimeString() +
        (result.truncated ? ' · truncated' : '') +
        ' · ' + result.alerts.length + ' alerts';
      render(agg, meta);
    } catch (err) {
      var msg = (err && err.message) ? err.message : String(err);
      if (/invalid filter|API 400/i.test(msg)) {
        msg = 'Unable to apply the current filters. Try Reset, or pick a different category/value.';
      }
      setError(msg);
      document.getElementById('aaMeta').textContent = 'Error';
      document.getElementById('aaDonut').innerHTML = '<div class="aa-empty">Unavailable</div>';
      document.getElementById('aaSources').innerHTML = '<div class="aa-empty">Unavailable</div>';
      document.getElementById('aaResources').innerHTML = '<div class="aa-empty">Unavailable</div>';
    }
  }

  document.getElementById('aaDonut').innerHTML = '<div class="aa-loading">Loading severity distribution…</div>';
  document.getElementById('aaSources').innerHTML = '<div class="aa-loading">Loading…</div>';
  document.getElementById('aaResources').innerHTML = '<div class="aa-loading">Loading…</div>';
  load(false);
  setInterval(function () { load(true); }, REFRESH_MS);
})();
</script>
