</style><div class="aa-root" id="aaRoot"><div class="aa-head"><div class="aa-title">Severity Breakdown</div><div class="aa-meta" id="aaMeta">Loading&hellip;</div></div><div id="aaProgress" class="aa-progress" aria-live="polite"><span class="aa-progress-spinner" aria-hidden="true"></span><div class="aa-progress-msg" id="aaProgressMsg">Loading alerts…</div><div class="aa-progress-track" aria-hidden="true"><div class="aa-progress-bar" id="aaProgressBar"></div></div></div><div id="aaTruncWarn" class="aa-warn" style="display:none;"><br></div><div id="aaError" class="aa-err" style="display:none;"><br></div><div class="aa-kpis" id="aaKpis"><div class="aa-card aa-total"><div class="lbl">Total Active Alerts</div><div class="val" id="aaTotal">&mdash;</div></div><div class="aa-card aa-crit"><div class="lbl">Critical</div><div class="val" id="aaCrit">&mdash;</div></div><div class="aa-card aa-errc"><div class="lbl">Error</div><div class="val" id="aaErrorCnt">&mdash;</div></div><div class="aa-card aa-warnc"><div class="lbl">Warning</div><div class="val" id="aaWarn">&mdash;</div></div></div><div class="aa-title" style="margin:4px 0 8px;">Alert Distribution</div><div class="aa-charts" id="aaCharts"><div class="aa-panel"><h3>Severity Distribution</h3><div class="aa-panel-body" id="aaDonut"><br></div></div><div class="aa-panel"><h3>Top Alert Sources</h3><div class="aa-panel-body" id="aaSources"><br></div></div><div class="aa-panel"><h3>Top Resources by Alert Count</h3><div class="aa-panel-body" id="aaResources"><br></div></div></div></div><script>
(function () {
  /* Severity Breakdown — keep working filter semantics; speed up load:
   * - Bounded parallel device/alert pagination (CONCURRENCY)
   * - Chunked monitorObjectName queries when >20 devices (avoid broad alert fetch)
   * - Progressive render after first alert page
   * - Optional sessionStorage device-name cache keyed by device filter
   * - Interval refresh respects analytics cache TTL
   */
  const CACHE_KEY = 'lmAlertDashAnalytics_v1';
  const CACHE_TTL_MS = 45000;
  const DEVICE_NAME_CACHE_KEY = 'lmDashDeviceNameCache_v1';
  const DEVICE_NAME_CACHE_TTL_MS = 10 * 60 * 1000;
  const PAGE_SIZE = 1000;
  const MAX_OFFSET = 10000;
  const MAX_RECORDS = 10000;
  const REFRESH_MS = 60000;
  const CONCURRENCY = 3; // bounded — do not raise without checking LM rate limits
  const NAME_CHUNK = 20; // max monitorObjectName OR values per alert API call
  const SEV_COLORS = { critical: '#e0351b', error: '#ff8c00', warn: '#f5ca1d' };
  const SEV_LABELS = { critical: 'Critical', error: 'Error', warn: 'Warning' };

  let csrfToken = null;
  let csrfFetchedAt = 0;
  const CSRF_TTL = 4 * 60 * 1000;
  let loadGeneration = 0;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function parseFiltersFromURL() {
    try {
      const loc = (parent && parent.window && parent.window.location) ? parent.window.location : window.location;
      const params = new URLSearchParams(loc.search);
      const raw = params.get('filters');
      if (!raw) return [];
      const parsed = JSON.parse(decodeURIComponent(raw));
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function selectedValues(filterEntry) {
    if (!filterEntry || !Array.isArray(filterEntry.v)) return [];
    return filterEntry.v
      .filter(function (x) { return x && (x.isSelected !== false); })
      .map(function (x) { return String(x.value == null ? '' : x.value); })
      .filter(function (v) { return v && v !== '*'; });
  }

  function stripGlob(v) {
    return String(v).replace(/\*+$/, '');
  }

  function isAllOrEmpty(vals) {
    return !vals || !vals.length || vals.every(function (v) { return v === '*' || v === ''; });
  }

  /** Run async workers with a fixed concurrency ceiling. */
  async function mapPool(items, limit, worker) {
    const results = new Array(items.length);
    let next = 0;
    const n = Math.min(limit, Math.max(1, items.length));
    const workers = [];
    for (let w = 0; w < n; w++) {
      workers.push((async function () {
        while (true) {
          const i = next++;
          if (i >= items.length) return;
          results[i] = await worker(items[i], i);
        }
      })());
    }
    await Promise.all(workers);
    return results;
  }

  function extractItems(data) {
    return (data && data.data && data.data.items) || (data && data.items) || [];
  }

  function extractTotal(data, items) {
    if (data && data.data && typeof data.data.total === 'number') return data.data.total;
    if (typeof data.total === 'number') return data.total;
    return items.length;
  }

  async function fetchCsrf() {
    const now = Date.now();
    if (csrfToken && (now - csrfFetchedAt) < CSRF_TTL) return csrfToken;
    const resp = await fetch('/santaba/rest/functions/dummy', {
      method: 'GET',
      credentials: 'include',
      headers: { 'X-Csrf-Token': 'Fetch', 'X-Version': '3', 'Accept': 'application/json' }
    });
    csrfToken = resp.headers.get('X-Csrf-Token') || resp.headers.get('x-csrf-token');
    csrfFetchedAt = now;
    if (!csrfToken) throw new Error('Unable to obtain CSRF token');
    return csrfToken;
  }

  async function lmGet(pathWithQuery) {
    const token = await fetchCsrf();
    const resp = await fetch('/santaba/rest' + pathWithQuery, {
      method: 'GET',
      credentials: 'include',
      headers: {
        'X-Csrf-Token': token,
        'X-Version': '3',
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      }
    });
    if (!resp.ok) {
      const t = await resp.text().catch(function () { return ''; });
      throw new Error('API ' + resp.status + ' for ' + pathWithQuery.split('?')[0] + (t ? ': ' + t.slice(0, 180) : ''));
    }
    return resp.json();
  }

  function propFilterClause(propName, values, systemProp) {
    const parts = [];
    values.forEach(function (v) {
      const clean = stripGlob(v);
      if (!clean || clean === '*' || String(clean).toLowerCase() === 'all') return;
      const key = systemProp ? 'systemProperties' : 'customProperties';
      // system.categories is multi-value — use contains (~) + *token*
      // Exact ":" on a single category (e.g. Aruba) caused API 400 / bad results.
      const useContains = (propName === 'system.categories');
      const op = useContains ? '~' : ':';
      const value = useContains ? ('*' + String(clean).replace(/\*/g, '') + '*') : clean;
      const obj = JSON.stringify({ name: propName, value: value }).replace(/"/g, '\\"');
      parts.push(key + op + '"' + obj + '"');
    });
    return parts;
  }

  function readNameCache(filterKey) {
    try {
      const raw = sessionStorage.getItem(DEVICE_NAME_CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.key !== filterKey) return null;
      if (!parsed.ts || (Date.now() - parsed.ts) > DEVICE_NAME_CACHE_TTL_MS) return null;
      if (!Array.isArray(parsed.names)) return null;
      return parsed.names;
    } catch (e) {
      return null;
    }
  }

  function writeNameCache(filterKey, names) {
    try {
      sessionStorage.setItem(DEVICE_NAME_CACHE_KEY, JSON.stringify({
        key: filterKey,
        ts: Date.now(),
        names: names
      }));
    } catch (e) { /* quota */ }
  }

  /** Paginate devices with optional filter; remaining pages use bounded concurrency. */
  async function fetchDevicePages(filterExpr) {
    // Names only — properties already applied via API filter when present
    const fields = 'id,name,displayName';
    const filterQs = filterExpr ? '&filter=' + encodeURIComponent(filterExpr) : '';
    const firstData = await lmGet('/device/devices?size=' + PAGE_SIZE + '&offset=0&fields=' + fields + filterQs);
    const firstItems = extractItems(firstData);
    const total = extractTotal(firstData, firstItems);
    const itemsOut = firstItems.slice();

    const totalPages = Math.ceil(Math.min(total, MAX_OFFSET) / PAGE_SIZE);
    if (totalPages > 1 && firstItems.length >= PAGE_SIZE) {
      const offsets = [];
      for (let p = 1; p < totalPages; p++) offsets.push(p * PAGE_SIZE);
      const pages = await mapPool(offsets, CONCURRENCY, async function (offset) {
        const data = await lmGet(
          '/device/devices?size=' + PAGE_SIZE + '&offset=' + offset + '&fields=' + fields + filterQs
        );
        return extractItems(data);
      });
      pages.forEach(function (items) {
        for (let i = 0; i < items.length; i++) itemsOut.push(items[i]);
      });
    }
    return itemsOut;
  }

  async function resolveDeviceNames(urlFilters) {
    const byProp = {};
    urlFilters.forEach(function (f) {
      if (!f || !f.n) return;
      byProp[f.n] = selectedValues(f).map(stripGlob);
    });

    const displayNames = (byProp['system.displayname'] || []).filter(function (v) { return v && v !== '*'; });
    const metaProps = [
      { n: 'system.categories', system: true },
      { n: 'tech.criticality.tier', system: false },
      { n: 'device_type', system: false },
      { n: 'location', system: false }
    ];

    // Support Group Tier: any of tier1/tier2/tier3 (FW chip). Prefer expanded displayNames when present.
    const supportTier = (byProp['fw.support_group_tier'] || []).filter(function (v) { return v && v !== '*'; });
    const supportTierProps = ['support.group.tier1', 'support.group.tier2', 'support.group.tier3'];

    const clauses = [];
    metaProps.forEach(function (p) {
      const vals = byProp[p.n] || [];
      if (!isAllOrEmpty(vals)) {
        const pcs = propFilterClause(p.n, vals, p.system);
        if (pcs.length) clauses.push(pcs.length === 1 ? pcs[0] : ('(' + pcs.join(' || ') + ')'));
      }
    });

    if (!isAllOrEmpty(supportTier) && !displayNames.length) {
      const tierClauses = [];
      supportTierProps.forEach(function (pn) {
        const pcs = propFilterClause(pn, supportTier, false);
        pcs.forEach(function (c) { tierClauses.push(c); });
      });
      if (tierClauses.length) clauses.push('(' + tierClauses.join(' || ') + ')');
    }

    if (!clauses.length && !displayNames.length) {
      return { names: null, forcedNames: displayNames.length ? displayNames : null };
    }

    if (displayNames.length && !clauses.length) {
      return { names: displayNames, forcedNames: displayNames };
    }

    const filter = clauses.join(',');
    const cacheKey = filter + '|' + displayNames.slice().sort().join('|');
    const cached = readNameCache(cacheKey);
    if (cached) {
      return { names: cached, forcedNames: displayNames.length ? displayNames : null };
    }

    const devices = await fetchDevicePages(filter);
    const names = new Set(displayNames);
    devices.forEach(function (d) {
      if (d.displayName) names.add(d.displayName);
      if (d.name) names.add(d.name);
    });

    let out;
    if (displayNames.length) {
      const allowed = new Set(displayNames);
      const intersect = [];
      names.forEach(function (n) { if (allowed.has(n)) intersect.push(n); });
      out = intersect.length ? intersect : Array.from(names);
    } else {
      out = Array.from(names);
    }

    writeNameCache(cacheKey, out);
    return { names: out, forcedNames: displayNames.length ? displayNames : null };
  }

  /** Base alert filter: cleared/sdted/severity + optional groups (no device names). */
  function buildAlertFilterBase(urlFilters) {
    const parts = ['cleared:false', 'sdted:false', 'severity:"4"|"3"|"2"'];
    const byProp = {};
    urlFilters.forEach(function (f) {
      if (f && f.n) byProp[f.n] = selectedValues(f).map(stripGlob);
    });

    const groups = (byProp['system.groups'] || []).filter(function (v) { return v && v !== '*'; });
    if (groups.length) {
      const gvals = groups.map(function (g) {
        const base = stripGlob(g);
        return base.endsWith('*') ? base : (base + '*');
      }).join('|');
      parts.push('monitorObjectGroups:"' + gvals.replace(/"/g, '') + '"');
    }
    return parts.join(',');
  }

  function withMonitorObjectNames(baseFilter, names) {
    if (!names || !names.length) return baseFilter;
    const cleaned = names.map(function (n) { return String(n).replace(/"/g, ''); });
    if (cleaned.length === 1) return baseFilter + ',monitorObjectName:"' + cleaned[0] + '"';
    return baseFilter + ',monitorObjectName:"' + cleaned.join('|') + '"';
  }

  function normalizeSeverity(a) {
    const s = a.severity;
    if (s === 4 || s === '4' || s === 'critical') return 'critical';
    if (s === 3 || s === '3' || s === 'error') return 'error';
    if (s === 2 || s === '2' || s === 'warn' || s === 'warning') return 'warn';
    return null;
  }

  function pushAlertItems(alerts, items, nameAllowSet) {
    items.forEach(function (a) {
      if (nameAllowSet && nameAllowSet.size) {
        const n = a.monitorObjectName || '';
        if (!nameAllowSet.has(n)) return;
      }
      const sev = normalizeSeverity(a);
      if (!sev) return;
      alerts.push({
        severity: sev,
        monitorObjectName: a.monitorObjectName || 'Unknown',
        resourceTemplateName: a.resourceTemplateName || a.instanceName || 'Unknown'
      });
    });
  }

  /**
   * Fetch all pages for one alert filter expression.
   * Page 0 first (enables progressive UI); remaining pages in parallel (bounded).
   */
  async function fetchAlertPagesForFilter(filter, nameAllowSet, onFirstPage) {
    const alerts = [];
    let truncated = false;
    const fields = 'id,severity,cleared,sdted,acked,monitorObjectName,resourceTemplateName,instanceName,dataPointName,startEpoch';
    const firstQ = '/alert/alerts?size=' + PAGE_SIZE + '&offset=0&sort=-startEpoch&filter=' +
      encodeURIComponent(filter) + '&fields=' + fields;
    const firstData = await lmGet(firstQ);
    const firstItems = extractItems(firstData);
    const total = extractTotal(firstData, firstItems);
    pushAlertItems(alerts, firstItems, nameAllowSet);

    if (typeof onFirstPage === 'function') {
      onFirstPage({ alerts: alerts.slice(), truncated: false, reportedTotal: total });
    }

    const maxPages = Math.ceil(Math.min(total, MAX_OFFSET, MAX_RECORDS) / PAGE_SIZE);
    if (maxPages > 1 && firstItems.length >= PAGE_SIZE) {
      const offsets = [];
      for (let p = 1; p < maxPages; p++) offsets.push(p * PAGE_SIZE);
      const pages = await mapPool(offsets, CONCURRENCY, async function (offset) {
        const q = '/alert/alerts?size=' + PAGE_SIZE + '&offset=' + offset +
          '&sort=-startEpoch&filter=' + encodeURIComponent(filter) + '&fields=' + fields;
        const data = await lmGet(q);
        return extractItems(data);
      });
      pages.forEach(function (items) {
        pushAlertItems(alerts, items, nameAllowSet);
      });
    }

    if (total > MAX_RECORDS || total > MAX_OFFSET) truncated = true;
    if (alerts.length > MAX_RECORDS) {
      alerts.length = MAX_RECORDS;
      truncated = true;
    }
    return { alerts: alerts, truncated: truncated, reportedTotal: total };
  }

  /**
   * Load alerts for current filters.
   * When many device names match, run chunked monitorObjectName queries (≤20 each)
   * in parallel instead of downloading the global alert set.
   */
  async function fetchAllAlerts(urlFilters, deviceNames, onProgress) {
    const base = buildAlertFilterBase(urlFilters);

    // No device scoping needed
    if (!deviceNames || !deviceNames.length) {
      return fetchAlertPagesForFilter(base, null, onProgress);
    }

    // Prefer unique display-oriented names for API (drop duplicates)
    const unique = Array.from(new Set(deviceNames.map(function (n) { return String(n); })));

    // Single chunk — one scoped filter
    if (unique.length <= NAME_CHUNK) {
      const filter = withMonitorObjectNames(base, unique);
      return fetchAlertPagesForFilter(filter, null, onProgress);
    }

    // Many devices: chunk names and query in parallel (bounded), merge results
    const chunks = [];
    for (let i = 0; i < unique.length; i += NAME_CHUNK) {
      chunks.push(unique.slice(i, i + NAME_CHUNK));
    }

    let firstProgressDone = false;
    const chunkResults = await mapPool(chunks, CONCURRENCY, async function (chunk, idx) {
      const filter = withMonitorObjectNames(base, chunk);
      const result = await fetchAlertPagesForFilter(
        filter,
        null,
        (idx === 0 && !firstProgressDone)
          ? function (partial) {
              firstProgressDone = true;
              if (typeof onProgress === 'function') onProgress(partial);
            }
          : null
      );
      return result;
    });

    const alerts = [];
    let truncated = false;
    let reportedTotal = 0;
    chunkResults.forEach(function (r) {
      if (!r) return;
      for (let i = 0; i < r.alerts.length; i++) alerts.push(r.alerts[i]);
      if (r.truncated) truncated = true;
      reportedTotal += r.reportedTotal || 0;
    });

    if (alerts.length > MAX_RECORDS) {
      alerts.length = MAX_RECORDS;
      truncated = true;
    }
    return { alerts: alerts, truncated: truncated, reportedTotal: reportedTotal || alerts.length };
  }

  function aggregate(alerts) {
    const counts = { critical: 0, error: 0, warn: 0 };
    const sources = {};
    const resources = {};
    alerts.forEach(function (a) {
      counts[a.severity] = (counts[a.severity] || 0) + 1;
      sources[a.resourceTemplateName] = (sources[a.resourceTemplateName] || 0) + 1;
      resources[a.monitorObjectName] = (resources[a.monitorObjectName] || 0) + 1;
    });
    const total = counts.critical + counts.error + counts.warn;
    function topN(map, n) {
      return Object.keys(map).map(function (k) { return { name: k, count: map[k] }; })
        .sort(function (a, b) { return b.count - a.count; })
        .slice(0, n);
    }
    function topWithOther(map, n) {
      const sorted = Object.keys(map).map(function (k) { return { name: k, count: map[k] }; })
        .sort(function (a, b) { return b.count - a.count; });
      const head = sorted.slice(0, n);
      const rest = sorted.slice(n);
      const other = rest.reduce(function (s, x) { return s + x.count; }, 0);
      if (other > 0) head.push({ name: 'Other', count: other });
      return head;
    }
    return {
      total: total,
      counts: counts,
      sources: topWithOther(sources, 8),
      resources: topN(resources, 10)
    };
  }

  function donutSvg(counts, total) {
    if (!total) return '<div class="aa-empty">No active alerts for the current filters</div>';
    const order = ['critical', 'error', 'warn'];
    const r = 42;
    const c = 2 * Math.PI * r;
    let offset = c * 0.25;
    let arcs = '';
    order.forEach(function (k) {
      const n = counts[k] || 0;
      if (!n) return;
      const len = (n / total) * c;
      arcs += '<circle cx="60" cy="60" r="' + r + '" fill="transparent" stroke="' + SEV_COLORS[k] +
        '" stroke-width="16" stroke-dasharray="' + len + ' ' + (c - len) +
        '" stroke-dashoffset="' + offset + '"></circle>';
      offset -= len;
    });
    const legend = order.map(function (k) {
      const n = counts[k] || 0;
      const pct = total ? ((n / total) * 100).toFixed(1) : '0.0';
      return '<li><span class="aa-swatch" style="background:' + SEV_COLORS[k] + '"></span>' +
        esc(SEV_LABELS[k]) + ' — ' + n + ' (' + pct + '%)</li>';
    }).join('');
    return '<svg viewBox="0 0 120 120" width="140" height="140" aria-label="Severity distribution">' +
      '<circle cx="60" cy="60" r="' + r + '" fill="transparent" stroke="#2a2f36" stroke-width="16"></circle>' +
      arcs +
      '<text x="60" y="56" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">' + total + '</text>' +
      '<text x="60" y="72" text-anchor="middle" fill="#9aa3ad" font-size="9">TOTAL</text></svg>' +
      '<ul class="aa-legend">' + legend + '</ul>';
  }

  function pieLikeBars(items, color) {
    if (!items.length) return '<div class="aa-empty">No data</div>';
    const max = Math.max.apply(null, items.map(function (x) { return x.count; })) || 1;
    return '<div class="aa-bars">' + items.map(function (x) {
      const pct = Math.max(2, Math.round((x.count / max) * 100));
      return '<div class="aa-bar-row" title="' + esc(x.name) + ': ' + x.count + '">' +
        '<div class="aa-bar-label">' + esc(x.name) + '</div>' +
        '<div class="aa-bar-track"><div class="aa-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<div class="aa-bar-n">' + x.count + '</div></div>';
    }).join('') + '</div>';
  }

  function render(agg, meta, opts) {
    opts = opts || {};
    document.getElementById('aaTotal').textContent = String(agg.total);
    document.getElementById('aaCrit').textContent = String(agg.counts.critical || 0);
    document.getElementById('aaErrorCnt').textContent = String(agg.counts.error || 0);
    document.getElementById('aaWarn').textContent = String(agg.counts.warn || 0);
    document.getElementById('aaDonut').innerHTML = donutSvg(agg.counts, agg.total);
    document.getElementById('aaSources').innerHTML = pieLikeBars(agg.sources, '#2f81f7');
    document.getElementById('aaResources').innerHTML = pieLikeBars(agg.resources, '#ff8c00');
    const metaEl = document.getElementById('aaMeta');
    metaEl.textContent = meta;
    if (opts.partial) metaEl.classList.add('is-loading');
    else metaEl.classList.remove('is-loading');

    const tw = document.getElementById('aaTruncWarn');
    if (!opts.partial && meta.indexOf('truncated') >= 0) {
      tw.style.display = 'block';
      tw.textContent = 'Results truncated at API pagination limit; counts may be incomplete.';
    } else if (!opts.partial) {
      tw.style.display = 'none';
    }
  }

  /** Show / update / hide the in-progress banner and partial styling. */
  function setLoadingState(state) {
    // state: { active, message, partial, percent } percent 0-100 or null for indeterminate
    const progress = document.getElementById('aaProgress');
    const msg = document.getElementById('aaProgressMsg');
    const bar = document.getElementById('aaProgressBar');
    const kpis = document.getElementById('aaKpis');
    const charts = document.getElementById('aaCharts');
    const metaEl = document.getElementById('aaMeta');
    if (!progress) return;

    if (!state || !state.active) {
      progress.classList.remove('is-visible');
      if (kpis) kpis.classList.remove('is-partial');
      if (charts) charts.classList.remove('is-partial');
      if (metaEl) metaEl.classList.remove('is-loading');
      if (bar) {
        bar.classList.remove('is-determinate');
        bar.style.width = '35%';
      }
      return;
    }

    progress.classList.add('is-visible');
    if (msg) msg.textContent = state.message || 'Loading alerts…';
    if (kpis) {
      if (state.partial) kpis.classList.add('is-partial');
      else kpis.classList.remove('is-partial');
    }
    if (charts) {
      if (state.partial) charts.classList.add('is-partial');
      else charts.classList.remove('is-partial');
    }
    if (metaEl) metaEl.classList.add('is-loading');

    if (bar) {
      if (typeof state.percent === 'number' && state.percent >= 0) {
        bar.classList.add('is-determinate');
        bar.style.width = Math.max(4, Math.min(100, state.percent)) + '%';
      } else {
        bar.classList.remove('is-determinate');
        bar.style.width = '35%';
      }
    }
  }

  function setError(msg) {
    setLoadingState({ active: false });
    const el = document.getElementById('aaError');
    el.style.display = 'block';
    el.textContent = msg;
    document.getElementById('aaTotal').textContent = '0';
    document.getElementById('aaCrit').textContent = '0';
    document.getElementById('aaErrorCnt').textContent = '0';
    document.getElementById('aaWarn').textContent = '0';
  }

  function clearError() {
    const el = document.getElementById('aaError');
    el.style.display = 'none';
    el.textContent = '';
  }

  async function load(force) {
    const gen = ++loadGeneration;
    clearError();
    setLoadingState({
      active: true,
      partial: false,
      message: 'Resolving filters and loading alerts…',
      percent: null
    });
    document.getElementById('aaMeta').textContent = 'Loading…';
    document.getElementById('aaMeta').classList.add('is-loading');
    const t0 = Date.now();
    try {
      const urlFilters = parseFiltersFromURL();
      const cacheKey = CACHE_KEY + ':' + JSON.stringify(urlFilters);
      if (!force) {
        try {
          const raw = sessionStorage.getItem(cacheKey);
          if (raw) {
            const cached = JSON.parse(raw);
            if (cached && cached.ts && (Date.now() - cached.ts) < CACHE_TTL_MS) {
              if (gen !== loadGeneration) return;
              setLoadingState({ active: false });
              render(cached.agg, 'Cached · last refresh ' + new Date(cached.ts).toLocaleTimeString() + (cached.truncated ? ' · truncated' : ''), { partial: false });
              return;
            }
          }
        } catch (e) { /* ignore cache */ }
      }

      setLoadingState({
        active: true,
        partial: false,
        message: 'Resolving matching resources…',
        percent: null
      });
      const resolved = await resolveDeviceNames(urlFilters);
      if (gen !== loadGeneration) return;

      const deviceNames = resolved.names; // null = unscoped; [] = no match; [...] = scoped
      if (Array.isArray(deviceNames) && deviceNames.length === 0) {
        setLoadingState({ active: false });
        const emptyAgg = { total: 0, counts: { critical: 0, error: 0, warn: 0 }, sources: [], resources: [] };
        render(emptyAgg, 'No matching resources', { partial: false });
        document.getElementById('aaError').style.display = 'block';
        document.getElementById('aaError').textContent = 'No matching resources found for the selected filters.';
        return;
      }

      const nameCount = Array.isArray(deviceNames) ? deviceNames.length : 0;
      setLoadingState({
        active: true,
        partial: false,
        message: nameCount
          ? ('Fetching alerts for ' + nameCount + ' resource' + (nameCount === 1 ? '' : 's') + '…')
          : 'Fetching active alerts…',
        percent: null
      });

      const result = await fetchAllAlerts(urlFilters, deviceNames, function (partial) {
        if (gen !== loadGeneration) return;
        const aggPartial = aggregate(partial.alerts);
        const reported = partial.reportedTotal || 0;
        const loaded = partial.alerts.length;
        let pct = null;
        let msg = 'Partial results — ' + loaded.toLocaleString() + ' alerts loaded so far. Updating…';
        if (reported > loaded) {
          pct = Math.min(99, Math.round((loaded / reported) * 100));
          msg = 'Partial results — ' + loaded.toLocaleString() + ' of ~' + reported.toLocaleString() +
            ' alerts (' + pct + '%). Counts will update…';
        }
        setLoadingState({ active: true, partial: true, message: msg, percent: pct });
        render(aggPartial, 'Updating… ' + loaded.toLocaleString() + ' alerts (partial)', { partial: true });
      });
      if (gen !== loadGeneration) return;

      const agg = aggregate(result.alerts);
      const ts = Date.now();
      try {
        sessionStorage.setItem(cacheKey, JSON.stringify({ ts: ts, agg: agg, truncated: result.truncated }));
      } catch (e) { /* quota */ }
      const elapsed = ts - t0;
      const meta = 'Last refresh ' + new Date(ts).toLocaleTimeString() +
        (result.truncated ? ' · truncated' : '') +
        ' · ' + result.alerts.length + ' alerts · ' + elapsed + 'ms';
      setLoadingState({ active: false });
      render(agg, meta, { partial: false });
    } catch (err) {
      if (gen !== loadGeneration) return;
      setLoadingState({ active: false });
      var msg = (err && err.message) ? err.message : String(err);
      if (/invalid filter|API 400/i.test(msg)) {
        msg = 'Unable to apply the current filters. Try Reset, or pick a different category/value.';
      }
      setError(msg);
      document.getElementById('aaMeta').textContent = 'Error';
      document.getElementById('aaMeta').classList.remove('is-loading');
      document.getElementById('aaDonut').innerHTML = '<div class="aa-empty">Unavailable</div>';
      document.getElementById('aaSources').innerHTML = '<div class="aa-empty">Unavailable</div>';
      document.getElementById('aaResources').innerHTML = '<div class="aa-empty">Unavailable</div>';
    }
  }

  setLoadingState({
    active: true,
    partial: false,
    message: 'Loading severity breakdown…',
    percent: null
  });
  document.getElementById('aaDonut').innerHTML = '<div class="aa-loading">Loading severity distribution…</div>';
  document.getElementById('aaSources').innerHTML = '<div class="aa-loading">Loading…</div>';
  document.getElementById('aaResources').innerHTML = '<div class="aa-loading">Loading…</div>';
  load(false);
  // Respect CACHE_TTL — do not force-bypass cache every tick
  setInterval(function () { load(false); }, REFRESH_MS);
})();
</script>
