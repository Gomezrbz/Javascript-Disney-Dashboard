// %%FWV7_CONFIG_END%%

	// ============================================================================
	// API CLIENT
	// ============================================================================
	class LogicMonitorAPI
	{
		constructor()
		{
			this.csrfToken = null;
			this.tokenExpiry = 0;
		}

		async getCsrfToken()
		{
			const now = Date.now();
			if (this.csrfToken && now < this.tokenExpiry)
			{
				return this.csrfToken;
			}
			try
			{
				const response = await fetch('/santaba/rest/functions/dummy',
				{
					method: 'GET',
					headers:
					{
						'X-Csrf-Token': 'Fetch',
						'Accept': 'application/json',
						'X-Version': '3'
					},
					credentials: 'include'
				});
				if (!response.ok)
				{
					const errorText = await response.text();
					if (response.status === 401) throw new Error('Authentication failed. Please refresh your LogicMonitor session and try again.');
					else throw new Error('CSRF API ' + response.status + ': ' + errorText.substring(0, 100));
				}
				this.csrfToken = response.headers.get('X-Csrf-Token');
				if (!this.csrfToken) throw new Error('CSRF Token not found in response headers');
				this.tokenExpiry = now + (30 * 60 * 1000);
				return this.csrfToken;
			}
			catch (error)
			{
				console.error('CSRF token error:', error);
				showErrorMessage('Authentication error: ' + error.message + '. Please refresh your LogicMonitor session.');
				throw error;
			}
		}

		async request(resourcePath, queryParams = '', httpVerb = 'GET', postBody = null)
		{
			const apiURL = '/santaba/rest' + resourcePath + queryParams;
			try
			{
				const token = await this.getCsrfToken();
				const response = await fetch(apiURL,
				{
					method: httpVerb,
					headers:
					{
						'Content-Type': 'application/json',
						'X-Csrf-Token': token,
						'X-Version': '3'
					},
					credentials: 'include',
					...(httpVerb !== 'GET' && postBody ?
					{
						body: JSON.stringify(postBody)
					} :
					{})
				});
				if (!response.ok)
				{
					const errorText = await response.text();
					if (response.status === 401) throw new Error('Authentication failed (401). Please check your LogicMonitor session.');
					else if (response.status === 403) throw new Error('Access denied (403). You may not have permission to access this resource.');
					else if (response.status === 429) throw new Error('Too many requests (429). Please slow down and try again later.');
					else if (response.status === 503) throw new Error('Service unavailable (503). Please try again.');
					else throw new Error('API ' + response.status + ' to ' + resourcePath + ': ' + errorText.substring(0, 200));
				}
				const contentType = response.headers.get('content-type');
				if (contentType && contentType.includes('application/json'))
				{
					const jsonData = await response.json();
					return jsonData;
				}
				throw new Error('API response not JSON');
			}
			catch (error)
			{
				console.error('API call error:', error);
				showErrorMessage('API error: ' + error.message);
				throw error;
			}
		}
	}

	const apiClient = new LogicMonitorAPI();
	const LogicMonitorClient = (path, params, method, body) => apiClient.request(path, params, method, body);

	// ============================================================================
	// API CACHE
	// ============================================================================
	const CACHE_VERSION = 'v30-exclude-upstream-cascade'; // Bump this to invalidate stale cache after code changes
	const apiCache = {
		data:
		{},
		ttl: 30 * 60 * 1000,
		set(key, value)
		{
			const serializedValue = value instanceof Set ? Array.from(value) : Array.isArray(value) ? value : [value];
			if (!Array.isArray(serializedValue))
			{
				console.error('apiCache.set: value must be an array or Set'); return;
			}
			this.data[key] = {
				value: serializedValue,
				timestamp: Date.now()
			};
			try
			{
				localStorage.setItem('filterWidgetV7APICache', JSON.stringify(
				{
					_version: CACHE_VERSION,
					entries: this.data
				}));
			}
			catch (e)
			{
				console.warn('Failed to persist API cache:', e);
			}
		},
		get(key)
		{
			const cached = this.data[key];
			if (!cached) return null;
			if (Date.now() - cached.timestamp > this.ttl)
			{
				delete this.data[key];
				return null;
			}
			if (!Array.isArray(cached.value))
			{
				delete this.data[key];
				return null;
			}
			return cached.value;
		},
		clear()
		{
			this.data = {};
			localStorage.removeItem('filterWidgetV7APICache');
		},
		init()
		{
			try
			{
				const stored = localStorage.getItem('filterWidgetV7APICache');
				if (stored)
				{
					const parsed = JSON.parse(stored);
						// Version check: if cache was written by a different code version, discard it entirely
					if (parsed._version !== CACHE_VERSION)
					{
						console.warn('[FilterWidget] Cache version mismatch (' + (parsed._version || 'none') + ' → ' + CACHE_VERSION + '), clearing stale cache');
						localStorage.removeItem('filterWidgetV7APICache');
						return;
					}
					const entries = parsed.entries || parsed; // support old format too
					Object.keys(entries).forEach(key =>
					{
						if (key === '_version') return;
						if (entries[key] && entries[key].timestamp && Date.now() - entries[key].timestamp <= this.ttl) this.data[key] = entries[key];
					});
				}
			}
			catch (e)
			{
				console.warn('Failed to load API cache:', e);
			}
		}
	};

		complete: false, // true when all pages have been fetched

		}
	};

	// Bounded concurrency for parallel page fetches (avoids unbounded Promise.all stampede / 429s).
	var DEVICE_FETCH_CONCURRENCY = 3;

	async function mapPool(items, limit, worker)
	{
		var results = new Array(items.length);
		var next = 0;
		var n = Math.min(limit, Math.max(1, items.length));
		var workers = [];
		for (var w = 0; w < n; w++)
		{
			workers.push((async function()
			{
				while (true)
				{
					var i = next++;
					if (i >= items.length) return;
					results[i] = await worker(items[i], i);
				}
			})());
		}
		await Promise.all(workers);
		return results;
	}

	// Warm the shared device cache: fetch ALL devices with no filter.
	// Called once at startup before any filter loads. All filters then
	// extract values client-side from this cache (zero additional API calls).
	// Uses BOUNDED parallel fetch (CONCURRENCY pages at once) — fast without overwhelming LM API.
	async function warmDeviceCache()
	{
		if (sharedDeviceCache.complete && sharedDeviceCache.devices.length > 0) return; // already warmed
		var _bannerShow = document.getElementById('cacheLoadingBanner');
		if (_bannerShow)
		{
			_bannerShow.innerHTML = '<span class="banner-spinner"></span> <span>Loading device data...</span>';
			_bannerShow.classList.add('is-visible');
			_bannerShow.style.display = 'flex';
		}
		sharedDeviceCache.clear();
		var _warmStart = Date.now();
		var pageSize = (FILTER_CONFIG && FILTER_CONFIG.maxResults) || 1000;
		var fields = 'id,name,systemProperties,autoProperties,customProperties,inheritedProperties';
		var baseParams = '?v=3&sort=id&size=' + pageSize + '&fields=' + fields;

		// Step 1: Fetch page 1 to get total count
		var firstData = await LogicMonitorClient('/device/devices', baseParams + '&offset=0', 'GET');
		var firstItems = (firstData && firstData.items) ? firstData.items : [];
		var apiTotal = (firstData && typeof firstData.total === 'number') ? firstData.total : 0;
		sharedDeviceCache.total = apiTotal;
		var totalPages = Math.ceil(apiTotal / pageSize);
		console.warn('[FilterWidget] warmDeviceCache: page 1 → ' + firstItems.length + ' items, total=' + apiTotal + ', pages=' + totalPages + ', concurrency=' + DEVICE_FETCH_CONCURRENCY);
		if (firstItems.length === 0) return;
		for (var i = 0; i < firstItems.length; i++) sharedDeviceCache.devices.push(firstItems[i]);

		// Step 2: Fetch remaining pages with bounded concurrency
		if (totalPages > 1 && firstItems.length >= pageSize)
		{
			var offsets = [];
			for (var pg = 1; pg < totalPages; pg++) offsets.push(pg * pageSize);
			var results = await mapPool(offsets, DEVICE_FETCH_CONCURRENCY, async function(offset)
			{
				return LogicMonitorClient('/device/devices', baseParams + '&offset=' + offset, 'GET');
			});
			for (var ri = 0; ri < results.length; ri++)
			{
				var pageItems = (results[ri] && results[ri].items) ? results[ri].items : [];
				for (var j = 0; j < pageItems.length; j++) sharedDeviceCache.devices.push(pageItems[j]);
			}
		}

		sharedDeviceCache.complete = true;
		sharedDeviceCache.filterKey = 'all-devices-no-filter';
		var _warmElapsed = Date.now() - _warmStart;
		console.warn('[FilterWidget] warmDeviceCache: DONE — cached ' + sharedDeviceCache.devices.length + '/' + apiTotal + ' devices in ' + _warmElapsed + 'ms (bounded parallel)');
			// Enable the config button and hide loading banner now that the cache is ready
		var _cfgBtn = document.getElementById('settingsMenuBtn');
		if (_cfgBtn) _cfgBtn.disabled = false;
		var _banner = document.getElementById('cacheLoadingBanner');
		if (_banner)
		{
			_banner.classList.remove('is-visible');
			_banner.style.display = 'none';
			_banner.innerHTML = '';
		}
		// Share a slim copy with Severity widget via sessionStorage (same portal origin)
		try
		{
			sessionStorage.setItem('lmDashDeviceCache_v1', JSON.stringify({
				ts: Date.now(),
				devices: sharedDeviceCache.devices
			}));
		}
		catch (e) { /* quota */ }
	}

	// ============================================================================
	// FILTER STATE MANAGEMENT
	// ============================================================================
	const filterState = {
		values:
		{},
		options:
		{},
		lookups:
		{}
	};
	let dashboardID;

	// ============================================================================
	// INTERPOLATION ENGINE
	// ============================================================================
	function interpolate(template, context)
	{
		if (!template || typeof template !== 'string') return template;
		return template.replace(/\$\{([^}]+)\}/g, (match, expr) =>
		{
			try
			{
				const evalContext = {
					config: FILTER_CONFIG,
					filters:
					{},
					prev: null,
					value: context.value || ''
				};
				FILTER_CONFIG.filters.forEach((f, idx) =>
				{
					const stateVal = filterState.values[f.id];
					const singleVal = (Array.isArray(stateVal) && stateVal.length > 0) ? stateVal[0] : null;
					evalContext.filters[f.id] = singleVal ||
					{
						id: '',
						name: '',
						value: ''
					};
					if (context.filterIndex !== undefined && idx === context.filterIndex - 1) evalContext.prev = singleVal ||
					{
						id: '',
						name: '',
						value: ''
					};
				});
				const parts = expr.split('.');
				let result = evalContext;
				for (const part of parts)
				{
					if (result === null || result === undefined) return '';
					result = result[part];
				}
				if (result === undefined || result === null) return '';
				if (typeof result === 'object' && result !== null && 'name' in result) return result.name;
				return result;
			}
			catch (e)
			{
				console.warn('Interpolation error for:', expr, e); return '';
			}
		});
	}

	var _transformFnCache = {};
	function applyTransform(value, transform)
	{
		if (!transform) return value;
		if (!_transformFnCache[transform])
		{
			try
			{
				_transformFnCache[transform] = new Function('value', 'return ' + transform);
			}
			catch (e)
			{
				console.warn('Transform compile error:', transform, e); _transformFnCache[transform] = function(v)
				{
					return v;
				};
			}
		}
		try
		{
			return _transformFnCache[transform](value);
		}
		catch (e)
		{
			return value;
		}
	}

	function getDisplayName(filterId, rawValue)
	{
		if (!rawValue || rawValue === 'All') return rawValue;
		const filterConfig = FILTER_CONFIG.filters.find(f => f.id === filterId);
		if (!filterConfig) return rawValue;
		const options = filterState.options[filterId];
		if (options && options.length > 0)
		{
			const matchByValue = options.find(opt => opt.value === rawValue);
			if (matchByValue) return matchByValue.name;
			const matchByName = options.find(opt => opt.name === rawValue);
			if (matchByName) return matchByName.name;
		}
		if (filterConfig.displayTransform) return applyTransform(rawValue, filterConfig.displayTransform);
		return rawValue;
	}

	// Helper to escape HTML
	function escapeHtml(str)
	{
		if (!str) return '';
		return String(str).replace(/&/g, '&').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	}

	// ============================================================================
	// CONDITIONAL VISIBILITY
	// ============================================================================
	function getVisibleFilters()
	{
		return FILTER_CONFIG.filters.filter(function(filter)
		{
			if (!filter.visibleWhen) return true;
			var conditions = filter.visibleWhen;
			for (var parentId in conditions)
			{
				if (!conditions.hasOwnProperty(parentId)) continue;
				var allowedValues = conditions[parentId];
				var parentValues = filterState.values[parentId];
				if (!parentValues || !Array.isArray(parentValues) || parentValues.length === 0) return false;
				var hasMatch = parentValues.some(function(pv)
				{
					return allowedValues.indexOf(pv.name) !== -1;
				});
				if (!hasMatch) return false;
			}
			return true;
		});
	}

	function isFilterVisible(filterId)
	{
		var visible = getVisibleFilters();
		return visible.some(function(f)
		{
			return f.id === filterId;
		});
	}

	function getDisplayedFilters()
	{
		return getVisibleFilters().filter(function(f)
		{
			return !f.hidden;
		});
	}

	function autoSelectHiddenFilter(filterId)
	{
		var filter = FILTER_CONFIG.filters.find(function(f)
		{
			return f.id === filterId;
		});
		var options = filterState.options[filterId] || [];
		var nonAll = options.filter(function(o)
		{
			return o.name !== 'All' && o.value !== '*';
		});
		if (filter && Array.isArray(filter.preselectedValues) && filter.preselectedValues.length > 0)
		{
			filterState.values[filterId] = nonAll.filter(function(o)
			{
				return filter.preselectedValues.indexOf(o.value) !== -1 || filter.preselectedValues.indexOf(o.name) !== -1;
			});
		}
		else
		{
			filterState.values[filterId] = nonAll;
		}
	}

	function applyPreselectedDefaults(filterId)
	{
		var filter = FILTER_CONFIG.filters.find(function(f)
		{
			return f.id === filterId;
		});
		if (!filter || filter.hidden) return;
		if (!Array.isArray(filter.preselectedValues) || filter.preselectedValues.length === 0) return;
		if (Array.isArray(filterState.values[filterId]) && filterState.values[filterId].length > 0) return;
		var options = filterState.options[filterId] || [];
		var matched = options.filter(function(o)
		{
			return filter.preselectedValues.indexOf(o.value) !== -1 || filter.preselectedValues.indexOf(o.name) !== -1;
		});
		if (matched.length > 0) filterState.values[filterId] = matched;
	}

	// ============================================================================
	// DYNAMIC UI RENDERING
	// ============================================================================
	function renderFilters()
	{
		const container = document.getElementById('filtersContainer');
		container.innerHTML = '';
		const visibleFilters = getDisplayedFilters();
		visibleFilters.forEach((filter) =>
		{
			const dropdownDiv = document.createElement('div');
			dropdownDiv.className = 'dropdown';
			dropdownDiv.setAttribute('data-filter-id', filter.id);
			const modeBadge = filter.filterMode === 'exclude' ? ' <span style="color:#e74c3c;font-size:10px;font-weight:normal;">(Exclude)</span>' : '';
			dropdownDiv.innerHTML = '<label for="filter_' + filter.id + '_input">' + filter.label + modeBadge + '</label><div class="custom-dropdown"><input type="text" id="filter_' + filter.id + '_input" placeholder="' + (filter.placeholder || 'Search...') + '" autocomplete="off"><div class="selected-tags" id="filter_' + filter.id + '_tags"></div><div class="options" id="filter_' + filter.id + '_options"></div><div class="loader" id="filter_' + filter.id + '_loader"><div class="spinner"></div></div></div>';
			container.appendChild(dropdownDiv);
			const input = document.getElementById('filter_' + filter.id + '_input');
			input.addEventListener('focus', () =>
			{
				input.value = '';
				showFilterOptions(filter.id);
				const optionsDiv = document.getElementById('filter_' + filter.id + '_options');
				if (optionsDiv) optionsDiv.querySelectorAll('div').forEach(o => o.style.display = 'block');
			});
			input.addEventListener('click', () => showFilterOptions(filter.id));
			input.addEventListener('input', () => filterDropdownOptions(filter.id));
		});
		if (!renderFilters._clickListenerAttached)
		{
			document.addEventListener('click', handleClickOutside);
			renderFilters._clickListenerAttached = true;
		}
		updateStatusStrip();
	}

	// ============================================================================
	// DROPDOWN MANAGEMENT
	// ============================================================================
	function showFilterOptions(filterId)
	{
		FILTER_CONFIG.filters.forEach(f =>
		{
			const opts = document.getElementById('filter_' + f.id + '_options'); if (opts) opts.style.display = f.id === filterId ? 'block' : 'none';
		});
	}

	function hideAllFilterOptions()
	{
		FILTER_CONFIG.filters.forEach(f =>
		{
			const opts = document.getElementById('filter_' + f.id + '_options'); if (opts) opts.style.display = 'none';
		});
	}

	function handleClickOutside(event)
	{
		if (!event.target.closest('.dropdown'))
		{
			hideAllFilterOptions();
			FILTER_CONFIG.filters.forEach(f => updateFilterDisplay(f.id));
		}
	}

	function filterDropdownOptions(filterId)
	{
		const input = document.getElementById('filter_' + filterId + '_input');
		const optionsDiv = document.getElementById('filter_' + filterId + '_options');
		const searchText = input.value.toLowerCase();
		optionsDiv.querySelectorAll('div').forEach(option =>
		{
			const name = option.getAttribute('data-name') || '';
			option.style.display = name.includes(searchText) ? 'block' : 'none';
		});
		showFilterOptions(filterId);
	}

	function populateFilterDropdown(filterId, options)
	{
		filterState.options[filterId] = options;
		filterState.lookups[filterId] = {};
		options.forEach(option =>
		{
			filterState.lookups[filterId][option.name] = option.id;
		});
		const container = document.getElementById('filter_' + filterId + '_options');
		if (!container)
		{
			enableAllControls(); return;
		}
		container.innerHTML = '';
		const selected = Array.isArray(filterState.values[filterId]) ? filterState.values[filterId] : [];
		const filterConfig = FILTER_CONFIG.filters.find(f => f.id === filterId);
		const isMulti = !filterConfig || filterConfig.multiSelect !== false;
		options.forEach(option =>
		{
			const div = document.createElement('div');
			const isSelected = selected.some(s => s.value === option.value);
			if (isMulti)
			{
				div.innerHTML = '<span class="option-check">' + (isSelected ? '&#10003;' : '&nbsp;') + '</span>' + escapeHtml(option.name);
			}
			else
			{
				div.innerHTML = escapeHtml(option.name);
			}
			if (isSelected) div.classList.add('option-selected');
			div.setAttribute('data-id', option.id);
			div.setAttribute('data-value', option.value || option.name);
			div.setAttribute('data-name', option.name.toLowerCase());
			div.addEventListener('click', (e) =>
			{
				e.stopPropagation(); handleFilterSelection(filterId, option);
			});
			container.appendChild(div);
		});
		const loader = document.getElementById('filter_' + filterId + '_loader');
		if (loader) loader.style.display = 'none';
		enableAllControls();
	}

	function handleFilterSelection(filterId, option)
	{
		if (!Array.isArray(filterState.values[filterId])) filterState.values[filterId] = [];

		const filterConfig = FILTER_CONFIG.filters.find(f => f.id === filterId);
		const isMulti = !filterConfig || filterConfig.multiSelect !== false;

		if (!isMulti)
		{
			filterState.values[filterId] = [option];
			hideAllFilterOptions();
			updateFilterDisplay(filterId);
		}
		else
		{
			const isAll = option.name === 'All' || option.value === '*';
			const existingIndex = filterState.values[filterId].findIndex(v => v.value === option.value);

			if (isAll)
			{
				filterState.values[filterId] = existingIndex !== -1 ? [] : [option];
			}
			else
			{
				if (existingIndex !== -1)
				{
					filterState.values[filterId].splice(existingIndex, 1);
				}
				else
				{
					filterState.values[filterId] = filterState.values[filterId].filter(v => v.name !== 'All' && v.value !== '*');
					filterState.values[filterId].push(option);
				}
			}

			updateDropdownCheckmarks(filterId);
		}

		const previouslyDisplayed = Array.from(document.querySelectorAll('#filtersContainer .dropdown')).map(el => el.getAttribute('data-filter-id'));
		const nowDisplayed = getDisplayedFilters().map(f => f.id);
		const nowVisible = getVisibleFilters().map(f => f.id);
		const visibilityChanged = previouslyDisplayed.length !== nowDisplayed.length || previouslyDisplayed.some((id, i) => id !== nowDisplayed[i]);

		if (visibilityChanged)
		{
			FILTER_CONFIG.filters.forEach(f =>
			{
				if (nowVisible.indexOf(f.id) === -1 && f.id !== filterId)
				{
					filterState.values[f.id] = [];
					filterState.options[f.id] = [];
				}
			});
			renderFilters();
			updateFilterDisplay(filterId);
			cascadeDownstream(filterId);
			getDisplayedFilters().forEach(f =>
			{
				if (f.id !== filterId) updateFilterDisplay(f.id);
			});
		}
		else
		{
			cascadeDownstream(filterId);
		}
		updateStatusStrip();
	}

	function updateFilterDisplay(filterId)
	{
		const input = document.getElementById('filter_' + filterId + '_input');
		const tagsContainer = document.getElementById('filter_' + filterId + '_tags');
		const values = Array.isArray(filterState.values[filterId]) ? filterState.values[filterId] : [];
		const filterConfig = FILTER_CONFIG.filters.find(f => f.id === filterId);
		const isMulti = !filterConfig || filterConfig.multiSelect !== false;

		if (input)
		{
			if (values.length === 0) input.value = '';
			else if (values.length === 1) input.value = values[0].name;
			else input.value = values.length + ' selected';
		}

		if (tagsContainer)
		{
			tagsContainer.innerHTML = '';
			if (isMulti && (values.length > 1 || (values.length === 1 && values[0].name !== 'All')))
			{
				values.forEach(v =>
				{
					const tag = document.createElement('span');
					tag.className = 'selected-tag';
					tag.innerHTML = escapeHtml(v.name) + ' <button class="tag-remove" title="Remove">&times;</button>';
					tag.querySelector('.tag-remove').addEventListener('click', (e) =>
					{
						e.stopPropagation();
						removeFilterValue(filterId, v.value);
					});
					tagsContainer.appendChild(tag);
				});
			}
		}
	}

	function removeFilterValue(filterId, value)
	{
		if (!Array.isArray(filterState.values[filterId])) return;
		filterState.values[filterId] = filterState.values[filterId].filter(v => v.value !== value);
		updateFilterDisplay(filterId);
		updateDropdownCheckmarks(filterId);
		cascadeDownstream(filterId);
		updateStatusStrip();
	}

	function updateDropdownCheckmarks(filterId)
	{
		const container = document.getElementById('filter_' + filterId + '_options');
		if (!container) return;
		const selected = Array.isArray(filterState.values[filterId]) ? filterState.values[filterId] : [];
		container.querySelectorAll('div').forEach(div =>
		{
			const value = div.getAttribute('data-value');
			const isSelected = selected.some(s => s.value === value);
			const check = div.querySelector('.option-check');
			if (check) check.innerHTML = isSelected ? '&#10003;' : '&nbsp;';
			if (isSelected) div.classList.add('option-selected');
			else div.classList.remove('option-selected');
		});
	}

	var _cascadeVersion = 0;
	async function cascadeDownstream(filterId)
	{
		const myVersion = ++_cascadeVersion;
		const filterIndex = FILTER_CONFIG.filters.findIndex(f => f.id === filterId);
		const visibleFilters = getVisibleFilters();
		for (const nextFilter of visibleFilters)
		{
			const nextIndex = FILTER_CONFIG.filters.findIndex(f => f.id === nextFilter.id);
			if (nextIndex <= filterIndex) continue;
			if (nextFilter.source === 'static') continue;
			if (_cascadeVersion !== myVersion) return;
			let options = [];
			if (nextFilter.source === 'api') options = await loadFromAPI(nextFilter, nextIndex);
			if (nextFilter.includeAll && (options.length === 0 || options[0].name !== 'All')) options.unshift(
			{
				id: nextFilter.allValue || '*',
				name: 'All',
				value: nextFilter.allValue || '*'
			});
			if (_cascadeVersion !== myVersion) return;
			populateFilterDropdown(nextFilter.id, options);
			if (nextFilter.hidden)
			{
				autoSelectHiddenFilter(nextFilter.id);
			}
			else if (Array.isArray(filterState.values[nextFilter.id]) && filterState.values[nextFilter.id].length > 0)
			{
				const optionValues = new Set(options.map(o => o.value));
				filterState.values[nextFilter.id] = filterState.values[nextFilter.id].filter(v =>
					v.name === 'All' || v.value === '*' || optionValues.has(v.value)
				);
			}
			updateFilterDisplay(nextFilter.id);
			updateDropdownCheckmarks(nextFilter.id);
		}
	}

	// ============================================================================
	// DATA LOADING
	// ============================================================================
	async function loadFilterData(filterIndex, silent)
	{
		const filter = FILTER_CONFIG.filters[filterIndex];
		if (!filter) return;
		const loader = document.getElementById('filter_' + filter.id + '_loader');
		if (!silent && loader) loader.style.display = 'inline-block';
		if (!silent) disableAllControls();
		try
		{
			let options = [];
			if (filter.source === 'api') options = await loadFromAPI(filter, filterIndex);
			else if (filter.source === 'static') options = filter.staticOptions.map(opt => (
			{
				id: opt,
				name: opt,
				value: opt
			}));
			if (filter.includeAll && (options.length === 0 || options[0].name !== 'All')) options.unshift(
			{
				id: filter.allValue || '*',
				name: 'All',
				value: filter.allValue || '*'
			});
			populateFilterDropdown(filter.id, options);
			if (filter.hidden)
			{
				autoSelectHiddenFilter(filter.id);
			}
			else if (!silent)
			{
				const input = document.getElementById('filter_' + filter.id + '_input');
				if (input)
				{
					input.focus(); showFilterOptions(filter.id);
				}
			}
		}
		catch (error)
		{
			console.error('Error loading filter ' + filter.id + ':', error);
			showErrorMessage('Failed to load ' + filter.label + ': ' + error.message);
			if (loader) loader.style.display = 'none';
			enableAllControls();
		}
	}

	async function loadFromAPI(filter, filterIndex)
	{
		console.warn('[FilterWidget] loadFromAPI: ' + filter.id + ' (index ' + filterIndex + ')');

		// Cache key: filter identity + upstream selections fingerprint
		var upstreamFingerprint = '';
		for (var ufi = 0; ufi < filterIndex; ufi++)
		{
			var upf = FILTER_CONFIG.filters[ufi];
			if (upf.source === 'static' || !upf.valuePropertyName) continue;
			var upVals = filterState.values[upf.id];
			if (upVals && Array.isArray(upVals) && upVals.length > 0 && !upVals.some(function(s)
				{
					return s.name === 'All';
				}))
			{
				upstreamFingerprint += '_' + upf.id + '=' + upVals.map(function(s)
				{
					return s.value;
				}).sort().join(',');
			}
		}
		var cacheKey = 'filter_' + filter.id + '_' + filter.valuePropertyName + '_' + (filter.valueTransform || '') + '_' + (filter.displayTransform || '') + upstreamFingerprint;
		var cachedData = apiCache.get(cacheKey);
		if (cachedData) return cachedData;

		// Ensure shared device cache is populated (no-op if already warm, ~6s parallel if not)
		if (!sharedDeviceCache.complete || sharedDeviceCache.devices.length === 0)
		{
			await warmDeviceCache();
		}

		var options = [];
		var seen = {};
		var matchCount = 0;
		var _propArrays = ['systemProperties', 'autoProperties', 'customProperties', 'inheritedProperties'];

		// ── Helper: find a property value across all 4 property arrays ──
		function findProperty(item, propName)
		{
			for (var i = 0; i < _propArrays.length; i++)
			{
				var arr = item[_propArrays[i]];
				if (Array.isArray(arr))
				{
					var found = arr.find(function(p)
					{
						return p.name === propName;
					});
					if (found && found.value) return found.value;
				}
			}
			return null;
		}

		// ── Helper: check if a device matches all visible upstream filter selections ──
		// Uses the same universal pipeline: split (delimiter) → filter → transform → compare
		// Skips non-visible filters (hidden by visibleWhen rules) so they don't affect matching
		// Include mode: device must have at least one transformed value in the selected set
		// Exclude mode: device must have none of its transformed values in the selected set (excluded values)
		function deviceMatchesUpstream(item, upToIndex)
		{
			for (var ui = 0; ui < upToIndex; ui++)
			{
				var uf = FILTER_CONFIG.filters[ui];
				if (!isFilterVisible(uf.id)) continue;
				if (uf.source === 'static' || !uf.valuePropertyName) continue;
				var sel = filterState.values[uf.id];
				if (!sel || !Array.isArray(sel) || sel.length === 0) continue;
				var hasAll = sel.some(function(s)
				{
					return s.name === 'All' || s.value === '*';
				});
				if (hasAll) continue;
				var selectedValues = sel.map(function(s)
				{
					return s.value;
				});
				var isExclude = uf.filterMode === 'exclude';
				var propVal = findProperty(item, uf.valuePropertyName);
				if (!propVal)
				{
					if (isExclude) continue;
					return false;
				}
				var vals = uf.delimiter ? propVal.split(uf.delimiter) : [propVal];
				if (isExclude)
				{
					for (var ve = 0; ve < vals.length; ve++)
					{
						var ev = vals[ve].trim();
						if (!ev) continue;
						if (uf.valueFilter && !applyTransform(ev, uf.valueFilter)) continue;
						if (uf.valueTransform) ev = applyTransform(ev, uf.valueTransform);
						if (selectedValues.indexOf(ev) !== -1) return false;
					}
					continue;
				}
				var matched = false;
				for (var vi = 0; vi < vals.length; vi++)
				{
					var v = vals[vi].trim();
					if (!v) continue;
					if (uf.valueFilter && !applyTransform(v, uf.valueFilter)) continue;
					if (uf.valueTransform) v = applyTransform(v, uf.valueTransform);
					if (selectedValues.indexOf(v) !== -1)
					{
						matched = true;
						break;
					}
				}
				if (!matched) return false;
			}
			return true;
		}

		// Extract unique values from cached devices for this filter
		// Universal pipeline: split (delimiter) → filter (valueFilter) → transform (valueTransform)
		sharedDeviceCache.devices.forEach(function(item)
		{
			if (!deviceMatchesUpstream(item, filterIndex)) return;
			var propValue = findProperty(item, filter.valuePropertyName);
			if (!propValue) return;
			matchCount++;

			// 1. Split: if delimiter is set, split into multiple values; otherwise single value
			var rawValues = filter.delimiter ? propValue.split(filter.delimiter) : [propValue];

			rawValues.forEach(function(rawVal)
			{
				rawVal = rawVal.trim();
				if (!rawVal) return;

				// 2. Filter: if valueFilter is set, only keep values where expression returns truthy
				if (filter.valueFilter)
				{
					if (!applyTransform(rawVal, filter.valueFilter)) return;
				}

				// 3. Transform: apply valueTransform to extract/reshape the value
				var value = rawVal;
				if (filter.valueTransform) value = applyTransform(value, filter.valueTransform);
				if (!value) return;

				// 4. Display: apply displayTransform for dropdown label
				var displayName = value;
				if (filter.displayTransform) displayName = applyTransform(value, filter.displayTransform);
				if (displayName && !seen[value])
				{
					seen[value] = true;
					options.push(
					{
						id: value,
						name: displayName,
						value: value
					});
				}
			});
		});

		console.warn('[FilterWidget] ' + filter.id + ': ' + matchCount + ' devices matched → ' + options.length + ' unique values');
		options.sort(function(a, b)
		{
			return a.name.toLowerCase().localeCompare(b.name.toLowerCase());
		});
		apiCache.set(cacheKey, options);
		return options;
	}

	// ============================================================================
	// URL FILTER BUILDING
	// ============================================================================
	/** LogicMonitor expects a non-empty v[] for built-in filter chips to apply. Bare * also breaks scoped globPattern filters (e.g. TW customer "All" needs Customers_Onprem/Touchworks/*). */
	function buildUrlFilterValueForAllSelect(filterConfig)
	{
		const gp = filterConfig.globPattern;
		if (gp && typeof gp === 'string' && gp.indexOf('${value}') !== -1)
		{
			let s = gp.replace(/\$\{value\}\*/g, '*').replace(/\$\{value\}/g, '*');
			while (s.indexOf('**') !== -1) s = s.replace(/\*\*/g, '*');
			return s || '*';
		}
		return '*';
	}

	function buildFilterURL()
	{
		const filters = [];
		const visibleFilters = getVisibleFilters();
		const visibleIds = visibleFilters.map(f => f.id);
		FILTER_CONFIG.filters.forEach((filterConfig, index) =>
		{
			if (filterConfig.source === 'static') return;
			if (visibleIds.indexOf(filterConfig.id) === -1) return;
			const stateValues = filterState.values[filterConfig.id];
			if (!stateValues || !Array.isArray(stateValues) || stateValues.length === 0) return;
			const hasAll = stateValues.some(v => v.name === 'All' || v.value === '*');
			if (hasAll)
			{
				const isExcludeAll = filterConfig.filterMode === 'exclude';
				const filterValue = buildUrlFilterValueForAllSelect(filterConfig);
				const vEntry = isExcludeAll ?
				{
					value: filterValue,
					label: filterValue
				} :
				{
					value: filterValue,
					label: filterValue,
					isSelected: true
				};
				const filterEntry = {
					n: filterConfig.property,
					v: [vEntry],
					t: 'RP'
				};
				if (isExcludeAll) filterEntry.i = 'e';
				filters.push(filterEntry);
				return;
			}
			const isExclude = filterConfig.filterMode === 'exclude';
			const vEntries = stateValues.map(sv =>
			{
				const rawValue = sv.value || sv.name;
				let filterValue;
				if (filterConfig.globPattern)
				{
					filterValue = interpolate(filterConfig.globPattern,
					{
						filterIndex: index,
						value: rawValue
					});
				}
				else
				{
					filterValue = rawValue;
					if (!filterValue.endsWith('*')) filterValue += '*';
				}
				if (isExclude) return {
					"value": filterValue,
					"label": filterValue
				};
				return {
					"value": filterValue,
					"label": filterValue,
					"isSelected": true
				};
			});
			const filterEntry = {
				"n": filterConfig.property,
				"v": vEntries,
				"t": "RP"
			};
			if (isExclude) filterEntry.i = 'e';
			filters.push(filterEntry);
		});
		return encodeURIComponent(JSON.stringify(filters));
	}

	function parseFiltersFromURL()
	{
		try
		{
			const urlParams = new URLSearchParams(parent.window.location.search);
			const filtersParam = urlParams.get('filters');
			if (!filtersParam) return null;
			const filters = JSON.parse(decodeURIComponent(filtersParam));
			const result = {};
			filters.forEach(filter =>
			{
				const urlMode = filter.i === 'e' ? 'exclude' : 'include';
				const candidates = FILTER_CONFIG.filters.filter(f => f.property === filter.n && f.source !== 'static');
				if (candidates.length === 0) return;
				let configFilter = candidates.length === 1 ? candidates[0] : candidates.find(f => isFilterVisible(f.id) && (f.filterMode || 'include') === urlMode) || candidates.find(f => isFilterVisible(f.id)) || candidates[0];
				if (filter.v && filter.v.length > 0)
				{
					const allUrlValue = buildUrlFilterValueForAllSelect(configFilter);
					if (filter.v.length === 1 && filter.v[0].value != null && filter.v[0].value === allUrlValue)
					{
						result[configFilter.id] = ['All'];
						return;
					}
					const values = filter.v.map(entry =>
					{
						let value = entry.value;
						if (value.endsWith('*')) value = value.slice(0, -1);
						if (value.endsWith('/')) value = value.slice(0, -1);
						if (value === '*') return 'All';
						if (configFilter.globPattern && value.indexOf('/') !== -1)
						{
							var patternParts = configFilter.globPattern.replace(/\$\{value\}/g, '<<<VALUE>>>').replace(/\*/g, '').split('/');
							var valueParts = value.split('/');
							for (var pp = 0; pp < patternParts.length; pp++)
							{
								if (patternParts[pp].indexOf('<<<VALUE>>>') !== -1 && valueParts[pp])
								{
									value = valueParts[pp];
									break;
								}
							}
						}
						return value;
					});
					result[configFilter.id] = values;
				}
				else
				{
					result[configFilter.id] = ['All'];
				}
			});
			return result;
		}
		catch (error)
		{
			console.error('Failed to parse filters from URL:', error); return null;
		}
	}

	function saveFilterState()
	{
		const state = {
			values:
			{},
			options: filterState.options,
			config: FILTER_CONFIG,
			timestamp: Date.now()
		};
		FILTER_CONFIG.filters.forEach(f =>
		{
			state.values[f.id] = filterState.values[f.id];
		});
		try
		{
			localStorage.setItem('filterWidgetV7State', JSON.stringify(state));
		}
		catch (error)
		{
			console.error('Failed to save filter state:', error);
		}
	}

	function loadFilterState()
	{
		try
		{
			const saved = localStorage.getItem('filterWidgetV7State');
			if (!saved) return false;
			const state = JSON.parse(saved);
			if (!state || !state.values) return false;
			const currentFilterIds = FILTER_CONFIG.filters.map(f => f.id).join(',');
			const savedFilterIds = (state.config && state.config.filters) ? state.config.filters.map(f => f.id).join(',') : '';
			if (currentFilterIds !== savedFilterIds)
			{
				console.warn('[FilterWidget] Config changed (' + savedFilterIds + ' → ' + currentFilterIds + '), discarding saved state');
				localStorage.removeItem('filterWidgetV7State');
				return false;
			}
			if (state.options)
			{
				Object.keys(state.options).forEach(filterId =>
				{
					filterState.options[filterId] = state.options[filterId]; populateFilterDropdown(filterId, state.options[filterId]);
				});
			}
			FILTER_CONFIG.filters.forEach(f =>
			{
				if (state.values[f.id])
				{
					const sv = state.values[f.id];
					const savedArray = Array.isArray(sv) ? sv : [sv];
					filterState.values[f.id] = savedArray.map(item =>
					{
						const rawValue = item.value || item.name;
						if (rawValue === '*' || item.name === 'All')
						{
							return {
								id: '*',
								name: 'All',
								value: '*'
							};
						}
						else
						{
							const displayName = getDisplayName(f.id, rawValue);
							return {
								id: item.id || rawValue,
								name: displayName,
								value: rawValue
							};
						}
					});
					updateFilterDisplay(f.id);
				}
			});
			updateStatusStrip();
			enableAllControls();
			return true;
		}
		catch (error)
		{
			console.error('Failed to load filter state:', error); return false;
		}
	}

	// ============================================================================
	// SELF-UPDATE: Save config back into widget source via LM API
	// ============================================================================

	async function findSelfWidget(dashboardId)
	{
		// Step 1: list all widgets on the dashboard, filter to text type
		const listResp = await LogicMonitorClient(
			'/dashboard/widgets',
			'?filter=dashboardId:' + dashboardId + '&fields=id,name,type&size=1000',
			'GET'
		);
		const textWidgets = (listResp.items || []).filter(w => w.type === 'text');
		if (textWidgets.length === 0) throw new Error('No text widgets found on dashboard ' + dashboardId);

		// Step 2: fetch full content of each text widget and look for our fingerprint
		const FINGERPRINT = '%%FWV7_CONFIG_BEGIN%%';
		for (const w of textWidgets)
		{
			const full = await LogicMonitorClient('/dashboard/widgets/' + w.id, '', 'GET');
			if (full && full.content && full.content.includes(FINGERPRINT))
			{
				return full;
			}
		}
		throw new Error('Could not find the Filter Widget v7 on this dashboard. Make sure the widget is on dashboard ' + dashboardId + '.');
	}

	function buildUpdatedWidgetContent(existingContent, newConfig)
	{
		const BEGIN = '// %%FWV7_CONFIG_BEGIN%%';
		const END = '// %%FWV7_CONFIG_END%%';
		const beginIdx = existingContent.indexOf(BEGIN);
		const endIdx = existingContent.indexOf(END);
		if (beginIdx === -1 || endIdx === -1 || endIdx <= beginIdx)
		{
			throw new Error('Config sentinels not found in widget content — cannot update source.');
		}
		const configJson = JSON.stringify(newConfig, null, '\t');
		const newBlock = BEGIN + '\nconst DEFAULT_FILTER_CONFIG = ' + configJson + ';\n' + END;
		return existingContent.substring(0, beginIdx) + newBlock + existingContent.substring(endIdx + END.length);
	}

	async function saveConfigToWidgetSource(runtimeConfig)
	{
		if (!dashboardID)
		{
			throw new Error('Dashboard ID not available. Make sure the widget is embedded in a LogicMonitor dashboard.');
		}

		// Find our own widget on the dashboard
		const widgetObj = await findSelfWidget(dashboardID);

		// Splice the new config into the source HTML
		const updatedContent = buildUpdatedWidgetContent(widgetObj.content, runtimeConfig);

		// PUT the full widget object back with only content changed
		const payload = Object.assign(
		{}, widgetObj,
		{
			content: updatedContent
		});
		await LogicMonitorClient('/dashboard/widgets/' + widgetObj.id, '', 'PUT', payload);

		return widgetObj.id;
	}

	/**
	 * Restore filter definitions to DEFAULT_FILTER_CONFIG from the widget script (not localStorage).
	 * Two-step confirm: optional JSON backup download, then confirm reset and cache clear.
	 */
	async function resetConfigToEmbeddedDefault()
	{
		const dropdown = document.getElementById('settingsDropdown');
		const chevron = document.getElementById('menuChevron');
		if (dropdown) dropdown.classList.remove('show');
		if (chevron) chevron.classList.remove('rotated');

		const saveBackup = confirm(
			'Step 1 of 2 — Save a copy of your settings?\n\n' +
			'Your browser may be using a locally saved filter configuration (for example if you cannot save to the widget in LogicMonitor). Before resetting, you can download that configuration as a JSON file so you can import it again later.\n\n' +
			'• OK — Download a backup file, then go to the next step\n' +
			'• Cancel — Skip the download and go to the next step\n\n' +
			'You can still stop the reset on the next prompt.'
		);
		if (saveBackup)
		{
			const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
			downloadFilterConfigJson('filter-widget-v7-config-backup-' + stamp + '.json');
		}

		if (!confirm(
			'Step 2 of 2 — Reset to the default in the widget HTML?\n\n' +
			'This loads the filter definitions that are built into this text widget (what your admin pasted in LogicMonitor), and replaces any copy stored only in your browser.\n\n' +
			'Cleared in this browser: saved configuration, wizard draft, and current dropdown selections. Kept: named filter presets under Filter Presets. Device data will reload.\n\n' +
			'• OK — Reset now\n' +
			'• Cancel — Do nothing; keep your current configuration'
		))
		{
			return;
		}

		try
		{
			FILTER_CONFIG = JSON.parse(JSON.stringify(DEFAULT_FILTER_CONFIG));
			localStorage.removeItem('filterWidgetV7Config');
			localStorage.removeItem('filterWidgetV7WizardState');
			localStorage.removeItem('filterWidgetV7State');
			apiCache.clear();
			sharedDeviceCache.clear();
			filterState.values = {};
			filterState.options = {};
			filterState.lookups = {};

			renderFilters();
			populatePresetsList();
			await initializeFilters();
			hideAllFilterOptions();
			FILTER_CONFIG.filters.forEach(f => updateFilterDisplay(f.id));
			updateStatusStrip();
			showErrorMessage('Done. Filter configuration now matches the default in the widget script.', 'success');
			setTimeout(() => hideErrorMessage(), 3500);
		}
		catch (e)
		{
			console.error('resetConfigToEmbeddedDefault:', e);
			showErrorMessage('Reset failed: ' + e.message);
		}
	}

	function importFilterConfig(event)
	{
		const file = event.target.files[0];
		if (!file) return;
		const reader = new FileReader();
		reader.onload = function(e)
		{
			try
			{
				const imported = JSON.parse(e.target.result);
				if (imported.filters && Array.isArray(imported.filters))
				{
					FILTER_CONFIG = imported;
					localStorage.setItem('filterWidgetV7Config', JSON.stringify(FILTER_CONFIG));
					localStorage.removeItem('filterWidgetV7WizardState');
					renderFilters();
					initializeFilters();
					showErrorMessage('Configuration imported!');
					setTimeout(() => hideErrorMessage(), 2000);
				}
				else
				{
					throw new Error('Invalid configuration format');
				}
			}
			catch (error)
			{
				showErrorMessage('Failed to import configuration: ' + error.message);
			}
		};
		reader.readAsText(file); event.target.value = '';
	}

	let configPopup = null;

	function openConfigModal()
	{
		document.getElementById('settingsDropdown').classList.remove('show');
		document.getElementById('menuChevron').classList.remove('rotated');

		if (configPopup && !configPopup.closed)
		{
			configPopup.focus(); return;
		}

		const width = Math.min(1480, Math.max(960, screen.width - 48));
		const height = Math.min(860, Math.max(640, screen.height - 48));
		const left = Math.max(0, (screen.width - width) / 2);
		const top = Math.max(0, (screen.height - height) / 2);
		const popupName = 'FilterConfigWizard_' + Date.now();

		configPopup = window.open('', popupName, 'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes');

		if (!configPopup)
		{
			document.getElementById('configModalOverlay').classList.add('show');
			document.getElementById('filterConfigContainer').innerHTML = '<p style="padding:20px;color:#666;">Popup blocked by browser. Please allow popups for this site to use the configuration wizard.</p>';
			showErrorMessage('Popup blocked. Please allow popups for this site.');
			return;
		}

		const popupContent = buildConfigWizardContent();
		configPopup.document.open();
		configPopup.document.write(popupContent);
		configPopup.document.close();

		setTimeout(() =>
		{
			if (configPopup && !configPopup.closed)
			{
				configPopup.FILTER_CONFIG_COPY = JSON.parse(JSON.stringify(FILTER_CONFIG));
				configPopup.parentWidget = window;
				configPopup.LMClient = LogicMonitorClient;
					// Pass cached devices for live preview in the wizard
				configPopup.cachedDevices = sharedDeviceCache.devices || [];
					// Snapshot main UI selections so wizard preselected-value lists respect cascade (same as loadFromAPI)
				try
				{
					configPopup.parentFilterStateValues = JSON.parse(JSON.stringify(filterState.values));
				}
				catch (e)
				{
					configPopup.parentFilterStateValues = {};
				}
				// Load wizard state if available
				try
				{
					const savedWizard = localStorage.getItem('filterWidgetV7WizardState');
					if (savedWizard) configPopup.SAVED_WIZARD_STATE = JSON.parse(savedWizard);
				}
				catch (e)
				{}
				if (configPopup.initializeWizard) configPopup.initializeWizard();
			}
		}, 100);

		const checkPopupClosed = setInterval(() =>
		{
			if (!configPopup || configPopup.closed)
			{
				clearInterval(checkPopupClosed); configPopup = null;
			}
		}, 500);
	}

	function applyConfigFromPopup(newConfig, wizardState)
	{
		FILTER_CONFIG = newConfig;
		localStorage.setItem('filterWidgetV7Config', JSON.stringify(FILTER_CONFIG));
		if (wizardState)
		{
			try
			{
				localStorage.setItem('filterWidgetV7WizardState', JSON.stringify(wizardState));
			}
			catch (e)
			{}
		}
		renderFilters();
		initializeFilters();
	}

	function closeConfigModal(event)
	{
		if (!event || event.target === event.currentTarget) document.getElementById('configModalOverlay').classList.remove('show');
	}

	document.addEventListener('click', function(event)
	{
		const menuContainer = document.querySelector('.settings-menu-container');
		const dropdown = document.getElementById('settingsDropdown');
		if (menuContainer && dropdown && !menuContainer.contains(event.target))
		{
			dropdown.classList.remove('show'); const chevron = document.getElementById('menuChevron'); if (chevron) chevron.classList.remove('rotated');
		}
	});

function initializeWizard() {
	if (window.FILTER_CONFIG_COPY) FILTER_CONFIG_COPY = window.FILTER_CONFIG_COPY;

		var hasOldFields = SAVED_WIZARD_STATE.filters.some(function(f) { return f.hasOwnProperty('valueTransformPreset') || f.hasOwnProperty('hasPathExtract'); });
		if (hasOldFields) {
			SAVED_WIZARD_STATE = null;
			localStorage.removeItem('filterWidgetV7WizardState');
		}
	}

	if (SAVED_WIZARD_STATE && SAVED_WIZARD_STATE.filters && SAVED_WIZARD_STATE.filters.length > 0) {
		wizardState = SAVED_WIZARD_STATE;
	} else if (FILTER_CONFIG_COPY) {
		wizardState.filterCount = FILTER_CONFIG_COPY.filters.length;
		wizardState.filters = FILTER_CONFIG_COPY.filters.map(f => reverseEngineerFilter(f));
	}
	deduplicateAllFilterIds();
	wizardState.currentStep = 0;
	try { renderWizard(); } catch(e) {
		var el = document.getElementById('wizardBody') || document.body;
		el.innerHTML = '<div style="padding:20px;color:red;font-family:monospace;white-space:pre-wrap;"><b>initializeWizard ERROR:</b> ' + e.message + '\\n' + (e.stack || '') + '</div>';
	}
}

function reverseEngineerFilter(f) {
	// Detect extraction preset from saved _wizard metadata or from runtime fields
	let extractionPreset = 'direct';
	let extractionConfig = {};
	if (f._wizard && f._wizard.extractionPreset) {
		extractionPreset = f._wizard.extractionPreset;
		extractionConfig = f._wizard.extractionConfig || {};
	} else if (f.valueTransform) {
		// Try to detect splitPick pattern: value.split('X')[N]
		const splitMatch = f.valueTransform.match(/value\\.split\\(['"]([^'"]+)['"]\\)\\[(\\d+)\\]/);
		if (splitMatch) {
			extractionPreset = 'splitPick';
			extractionConfig = { splitChar: splitMatch[1], splitIndex: parseInt(splitMatch[2]), multiSep: f.delimiter || '', startsWithFilter: '' };
			// Try to detect startsWithFilter from valueFilter
			if (f.valueFilter) {
				const swMatch = f.valueFilter.match(/value\\.startsWith\\(['"]([^'"]+)['"]\\)/);
				if (swMatch) extractionConfig.startsWithFilter = swMatch[1];
			}
		}
	}

	return {
		label: f.label || '',
		placeholder: f.placeholder || '',
		id: f.id || '',
		source: f.source || 'api',
		property: f.property || '',
		valuePropertyName: f.valuePropertyName || '',
		staticOptions: f.staticOptions ? [...f.staticOptions] : [],
		includeAll: f.includeAll !== false,
		allValue: f.allValue || '*',
		multiSelect: f.multiSelect !== false,
		hidden: !!f.hidden,
		filterMode: f.filterMode || 'include',
		preselectedValues: Array.isArray(f.preselectedValues) ? f.preselectedValues.slice() : [],
		extractionPreset: extractionPreset,
		extractionConfig: extractionConfig,
		globPattern: f.globPattern || '',
		visibleWhen: f.visibleWhen ? JSON.parse(JSON.stringify(f.visibleWhen)) : null,
		_idManuallySet: !!f.id,
		_originalFilter: f
	};
}

function generateId(label) {
	return label.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'filter';
}

function deduplicateId(baseId, filterIndex) {
	var isDuplicate = wizardState.filters.some(function(f, i) {
		return i !== filterIndex && f.id === baseId;
	});
	if (!isDuplicate) return baseId;
	var f = wizardState.filters[filterIndex];
	if (f.visibleWhen) {
		var vals = [];
		for (var k in f.visibleWhen) {
			if (f.visibleWhen.hasOwnProperty(k)) vals = vals.concat(f.visibleWhen[k]);
		}
		if (vals.length > 0) {
			var candidate = baseId + '_' + generateId(vals[0]);
			if (!wizardState.filters.some(function(ff, ii) { return ii !== filterIndex && ff.id === candidate; })) return candidate;
		}
	}
	var suffix = 2;
	while (wizardState.filters.some(function(ff, ii) {
		return ii !== filterIndex && ff.id === baseId + '_' + suffix;
	})) { suffix++; }
	return baseId + '_' + suffix;
}

function refreshFilterId(filterIndex) {
	var f = wizardState.filters[filterIndex];
	if (!f || f._idManuallySet) return;
	var baseId = generateId(f.label);
	f.id = deduplicateId(baseId, filterIndex);
	var idInput = document.getElementById('wiz_id_input');
	if (idInput) idInput.value = f.id;
	renderProgress();
}

function deduplicateAllFilterIds() {
	// Pass 1: ensure conditional filters include their visibleWhen suffix (skip manually set IDs)
	for (var i = 0; i < wizardState.filters.length; i++) {
		var f = wizardState.filters[i];
		if (f._idManuallySet) continue;
		if (!f.visibleWhen) continue;
		var vals = [];
		for (var k in f.visibleWhen) {
			if (f.visibleWhen.hasOwnProperty(k)) vals = vals.concat(f.visibleWhen[k]);
		}
		if (vals.length === 0) continue;
		var suffix = generateId(vals[0]);
		var currentId = f.id || generateId(f.label);
		if (currentId.indexOf(suffix) === -1) {
			var baseId = generateId(f.label);
			f.id = baseId + '_' + suffix;
		}
	}
	// Pass 2: resolve any remaining collisions with numeric suffix
	var seen = {};
	for (var j = 0; j < wizardState.filters.length; j++) {
		var ff = wizardState.filters[j];
		var id = ff.id || generateId(ff.label);
		if (!seen[id]) {
			seen[id] = true;
			ff.id = id;
		} else {
			var n = 2;
			while (seen[id + '_' + n]) n++;
			ff.id = id + '_' + n;
			seen[ff.id] = true;
		}
	}
}

function ensureFilterCount(count) {
	while (wizardState.filters.length < count) {
		const idx = wizardState.filters.length + 1;
		wizardState.filters.push({
			label: 'Filter ' + idx, placeholder: '', id: 'filter_' + idx, source: 'api', property: '',
			valuePropertyName: '',
			staticOptions: [], includeAll: true, allValue: '*', multiSelect: true, hidden: false, filterMode: 'include',
			preselectedValues: [],
			extractionPreset: 'direct', extractionConfig: {},
			globPattern: '',
			visibleWhen: null,
			_idManuallySet: false
		});
	}
	wizardState.filters = wizardState.filters.slice(0, count);
}

function getTotalSteps() { return 1 + wizardState.filterCount + 1; }

function renderWizard() {
	renderProgress();
	renderStepContent();
	updateButtons();
}

function renderProgress() {
	const totalSteps = getTotalSteps();
	let html = '';
	for (let i = 0; i < totalSteps; i++) {
		if (i > 0) html += '<div class="progress-line' + (i <= wizardState.currentStep ? ' completed' : '') + '"></div>';
		let label = '';
		let cls = '';
		if (i === 0) label = 'Setup';
		else if (i <= wizardState.filterCount) label = wizardState.filters[i-1] ? (wizardState.filters[i-1].label || 'Filter ' + i) : 'Filter ' + i;
		else label = 'Review';
		if (i < wizardState.currentStep) cls = 'completed';
		else if (i === wizardState.currentStep) cls = 'active';
		html += '<div class="progress-step">';
		var dotContent = '';
		if (i < wizardState.currentStep) dotContent = '&#10003;';
		else if (i === 0) dotContent = '&#9881;';
		else if (i <= wizardState.filterCount) dotContent = '' + i;
		else dotContent = '&#9776;';
		var isIcon = (i === 0 || i > wizardState.filterCount);
		html += '<div class="progress-dot ' + cls + (isIcon ? ' icon' : '') + '" onclick="goToStep(' + i + ')">' + dotContent + '</div>';
		html += '<div class="progress-label' + (i === wizardState.currentStep ? ' active' : '') + '">' + label + '</div>';
		if (i > 0 && i <= wizardState.filterCount && wizardState.filters[i-1] && wizardState.filters[i-1].id) {
			html += '<div class="progress-id">' + escapeH(wizardState.filters[i-1].id) + '</div>';
		}
		html += '</div>';
	}
	document.getElementById('wizardProgress').innerHTML = html;
}

function renderStepContent() {
	const step = wizardState.currentStep;
	const body = document.getElementById('wizardBody');

	if (step === 0) {
		renderStep1(body);
	} else if (step <= wizardState.filterCount) {
		renderFilterStep(body, step - 1);
	} else {
		renderReviewStep(body);
	}
}

function renderStep1(container) {
	container.innerHTML = '<div class="step-title">How many filters do you need?</div>' +
		'<div class="step-subtitle">Each filter extracts unique values from a device property. Selecting a value in one filter narrows the devices available to the next. Choose how many filter dropdowns you want on your dashboard.</div>' +
		'<div class="count-selector" id="countSelector"></div>' +
		'<div style="margin-top:16px;font-size:12px;color:#999;text-align:center;">Need more than ${MAX_FILTERS}? Search the widget code for <code>MAX_FILTERS</code> and increase the value.</div>' +
		'<div style="margin-top:6px;font-size:12px;color:#999;text-align:center;">You can reorder filters later on the Review step.</div>';

	const sel = document.getElementById('countSelector');
	let circlesHtml = '';
	for (let i = 1; i <= ${MAX_FILTERS}; i++) {
		circlesHtml += '<div class="count-circle' + (i === wizardState.filterCount ? ' selected' : '') + '" onclick="selectCount(' + i + ')">' + i + '</div>';
	}
	sel.innerHTML = circlesHtml;
}

function selectCount(n) {
	wizardState.filterCount = n;
	ensureFilterCount(n);
	renderWizard();
}

	// Section B: Data Source
	html += '<div class="config-section"><h3>&#128268; Where Does the Data Come From?</h3><div class="section-help">Choose how this filter gets its list of options.</div>';

	html += '<div class="source-card' + (f.source === 'static' ? ' selected' : '') + '" onclick="selectSource(' + filterIndex + ',\\'static\\')"><div class="card-icon">&#128221;</div><div class="card-title">Custom List</div><div class="card-desc">Type your own list of options</div></div>';
	html += '</div>';

	// Section C: Source-specific config (static only — API needs no extra config)

		html += '<div class="suggestion-list" id="propertySuggestions"></div></div>';
		html += '<div class="help-text">The device property to read unique values from for the dropdown options</div></div>';

		// Value Extraction — two simple options

		html += '<option value="splitPick"' + (f.extractionPreset === 'splitPick' ? ' selected' : '') + '>Split by character and pick a piece</option>';
		html += '</select>';
		html += '<div class="help-text">Choose how the raw property value becomes a dropdown option.</div>';

		if (f.extractionPreset === 'splitPick') {
			var cfg = f.extractionConfig || {};
			html += '<div style="margin-top:8px;padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:6px;">';

	html += '<div class="form-group"><label>Preselected values</label>';

	} else {

	}
	html += '</div>';

	html += '</div>';

	// Section E: Dashboard URL Matching
	if (f.source === 'api') {
		html += '<div class="config-section"><h3>&#127760; Dashboard URL Matching</h3><div class="section-help">Control how the selected value is matched in the dashboard URL.</div>';
		html += '<div class="form-group"><label>URL Match Pattern</label>';
		html += '<input class="form-input" value="' + escapeH(f.globPattern || '\${value}*') + '" placeholder="\${value}*" oninput="onFieldChange(\\'globPattern\\',' + filterIndex + ',this.value)">';

		html += 'Examples: <code>\${value}*</code> (prefix match) &nbsp; <code>\${value}</code> (exact match) &nbsp; <code>*\${value}*</code> (contains)</div></div>';
		html += '</div>';
	}

	container.innerHTML = html;
	// Trigger live preview after DOM is updated
	if (f.extractionPreset === 'splitPick') setTimeout(function() { updateExtractionPreview(filterIndex); }, 0);
  } catch(e) {
	container.innerHTML = '<div style="padding:20px;color:red;font-family:monospace;white-space:pre-wrap;"><b>renderFilterStep ERROR:</b> ' + e.message + '\\nFilter index: ' + filterIndex + '\\n' + (e.stack || '') + '</div>';
  }
}

// ── Searchable Select Component ──────────────────────────────────────
// Registry stores callback expressions keyed by select ID, avoiding inline escaping issues
var _ssRegistry = {};

function renderSearchableSelect(id, options, selectedValue, onChangeExpr, extraClass) {
	// Store the callback expression in the registry instead of inline HTML
	_ssRegistry[id] = onChangeExpr;
	var selLabel = '';
	options.forEach(function(o) { if (o.value === selectedValue) selLabel = o.label; });
	if (!selLabel && selectedValue) selLabel = selectedValue;
	if (!selLabel && options.length) selLabel = options[0].label;
	var cls = 'searchable-select' + (extraClass ? ' ' + extraClass : '');
	var h = '<div class="' + cls + '" id="ss_wrap_' + id + '">';
	h += '<div class="searchable-select-trigger" onclick="toggleSearchableSelect(\\'' + id + '\\')" title="' + escapeH(selLabel) + '"><span class="ss-label">' + escapeH(selLabel) + '</span><span class="ss-arrow">&#9662;</span></div>';
	h += '<div class="searchable-select-dropdown" id="ss_dd_' + id + '">';
	h += '<input class="searchable-select-search" placeholder="Search..." oninput="filterSearchableOptions(\\'' + id + '\\',this.value)" onclick="event.stopPropagation()">';
	h += '<div class="searchable-select-options" id="ss_opts_' + id + '">';
	options.forEach(function(o) {
		var isSel = o.value === selectedValue;
		h += '<div class="searchable-select-option' + (isSel ? ' selected' : '') + '" data-value="' + escapeH(o.value) + '" data-label="' + escapeH(o.label) + '" onclick="selectSearchableOption(\\'' + id + '\\',this)">' + escapeH(o.label) + '</div>';
	});
	h += '</div>';
	h += '<div class="searchable-select-no-match">No matches found</div>';
	h += '</div></div>';
	return h;
}

function toggleSearchableSelect(id) {
	var dd = document.getElementById('ss_dd_' + id);
	if (!dd) return;
	var isOpen = dd.classList.contains('open');
	// Close all other open searchable selects first
	document.querySelectorAll('.searchable-select-dropdown.open').forEach(function(el) { el.classList.remove('open'); });
	if (!isOpen) {
		dd.classList.add('open');
		var searchInput = dd.querySelector('.searchable-select-search');
		if (searchInput) { searchInput.value = ''; filterSearchableOptions(id, ''); searchInput.focus(); }
		// Scroll to selected option
		var selOpt = dd.querySelector('.searchable-select-option.selected');
		if (selOpt) { var container = dd.querySelector('.searchable-select-options'); if (container) container.scrollTop = selOpt.offsetTop - container.offsetTop - 40; }
	}
}

function filterSearchableOptions(id, query) {
	var container = document.getElementById('ss_opts_' + id);
	var noMatch = container ? container.parentElement.querySelector('.searchable-select-no-match') : null;
	if (!container) return;
	var q = query.toLowerCase();
	var visibleCount = 0;
	container.querySelectorAll('.searchable-select-option').forEach(function(opt) {
		var label = (opt.getAttribute('data-label') || '').toLowerCase();
		var val = (opt.getAttribute('data-value') || '').toLowerCase();
		if (!q || label.indexOf(q) !== -1 || val.indexOf(q) !== -1) {
			opt.classList.remove('hidden');
			visibleCount++;
		} else {
			opt.classList.add('hidden');
		}
	});
	if (noMatch) noMatch.style.display = visibleCount === 0 ? 'block' : 'none';
}

function selectSearchableOption(id, el) {
	var value = el.getAttribute('data-value');
	var label = el.getAttribute('data-label');
	// Update trigger label
	var wrap = document.getElementById('ss_wrap_' + id);
	if (wrap) {
		var trigger = wrap.querySelector('.ss-label');
		if (trigger) { trigger.textContent = label; wrap.querySelector('.searchable-select-trigger').title = label; }
		// Update selected state
		wrap.querySelectorAll('.searchable-select-option').forEach(function(opt) {
			opt.classList.toggle('selected', opt.getAttribute('data-value') === value);
		});
	}
	// Close dropdown
	var dd = document.getElementById('ss_dd_' + id);
	if (dd) dd.classList.remove('open');
	// Fire the callback from registry
	var expr = _ssRegistry[id];
	if (expr) {
		try { eval(expr.replace('__VALUE__', value)); } catch(e) { console.warn('Searchable select callback error:', e); }
	}
}

// Global click handler to close open searchable selects when clicking outside
document.addEventListener('click', function(e) {
	if (!e.target.closest('.searchable-select')) {
		document.querySelectorAll('.searchable-select-dropdown.open').forEach(function(el) { el.classList.remove('open'); });
	}
});

// ========== Event Handlers ==========
function moveFilter(from, to) {
	const filters = wizardState.filters;
	if (to < 0 || to >= filters.length) return;
	const item = filters.splice(from, 1)[0];
	filters.splice(to, 0, item);
	renderWizard();
}

function deleteFilterAt(index) {
	if (wizardState.filters.length <= 1) {
		showWizardMessage('At least one filter is required.', 'warning');
		return;
	}
	var f = wizardState.filters[index];
	var label = f.label || ('Filter ' + (index + 1));
	if (!confirm('Remove filter "' + label + '" from this configuration?')) return;
	var removedId = f.id;
	wizardState.filters.splice(index, 1);
	wizardState.filterCount = wizardState.filters.length;
	wizardState.filters.forEach(function(ff) {
		if (ff.visibleWhen && ff.visibleWhen[removedId]) {
			delete ff.visibleWhen[removedId];
			if (Object.keys(ff.visibleWhen).length === 0) ff.visibleWhen = null;
		}
	});
	deduplicateAllFilterIds();
	wizardState.currentStep = wizardState.filterCount + 1;
	renderWizard();
}

// ── Extraction preset handlers ──
function onExtractionPresetChange(idx, preset) {
	var f = wizardState.filters[idx];
	f.extractionPreset = preset;
	if (preset === 'direct') { f.extractionConfig = {}; }
	else if (preset === 'splitPick') { f.extractionConfig = { splitChar: '/', splitIndex: 0, multiSep: '', startsWithFilter: '' }; }
	renderWizard();
	if (preset === 'splitPick') updateExtractionPreview(idx);
}

function updateExtractionConfig(idx, key, value) {
	if (!wizardState.filters[idx].extractionConfig) wizardState.filters[idx].extractionConfig = {};
	wizardState.filters[idx].extractionConfig[key] = value;
}

// Live preview of extraction results using cached devices
function updateExtractionPreview(idx) {
	var previewEl = document.getElementById('extractionPreview_' + idx);
	if (!previewEl) return;
	var f = wizardState.filters[idx];
	var propName = f.valuePropertyName;
	var cfg = f.extractionConfig || {};
	var devices = window.cachedDevices || [];
	if (!propName || devices.length === 0) { previewEl.innerHTML = '<em>Enter a property name and wait for device cache to load.</em>'; return; }

	// Extract raw values from cached devices
	var rawValues = new Set();
	var propArrays = ['systemProperties','autoProperties','customProperties','inheritedProperties'];
	for (var d = 0; d < devices.length; d++) {
		var dev = devices[d];
		for (var a = 0; a < propArrays.length; a++) {
			var arr = dev[propArrays[a]];
			if (!arr) continue;
			for (var p = 0; p < arr.length; p++) {
				if (arr[p].name === propName) { rawValues.add(arr[p].value); }
			}
		}
	}

	if (rawValues.size === 0) { previewEl.innerHTML = '<em>No devices found with property "' + escapeH(propName) + '"</em>'; return; }

	// Apply extraction pipeline
	var extracted = new Set();
	var splitChar = cfg.splitChar || '/';
	var splitIndex = cfg.splitIndex || 0;
	var multiSep = cfg.multiSep || '';
	var startsWith = cfg.startsWithFilter || '';

	rawValues.forEach(function(raw) {
		var parts = multiSep ? raw.split(multiSep) : [raw];
		parts.forEach(function(part) {
			part = part.trim();
			if (startsWith && !part.startsWith(startsWith)) return;
			var pieces = part.split(splitChar);
			var picked = pieces[splitIndex] || '';
			if (picked) extracted.add(picked);
		});
	});

	var sorted = Array.from(extracted).sort();
	if (sorted.length === 0) { previewEl.innerHTML = '<em>No values extracted — check your settings.</em>'; return; }
	previewEl.innerHTML = '<strong>Preview (' + sorted.length + ' unique values):</strong><br>' + sorted.slice(0, 30).map(function(v) { return escapeH(v); }).join(', ') + (sorted.length > 30 ? ', ... +' + (sorted.length - 30) + ' more' : '');
}

// ========== Preselected Values (same cascade as main loadFromAPI) ==========
var _wizTransformFnCache = {};
function applyTransformWizard(value, transform) {
	if (!transform) return value;
	if (!_wizTransformFnCache[transform]) {
		try { _wizTransformFnCache[transform] = new Function('value', 'return ' + transform); }
		catch (e) { _wizTransformFnCache[transform] = function(v) { return v; }; }
	}
	try { return _wizTransformFnCache[transform](value); } catch (e) { return value; }
}

function findPropertyWizard(item, propName) {
	var propArrays = ['systemProperties', 'autoProperties', 'customProperties', 'inheritedProperties'];
	for (var i = 0; i < propArrays.length; i++) {
		var arr = item[propArrays[i]];
		if (Array.isArray(arr)) {
			var found = arr.find(function(p) { return p.name === propName; });
			if (found && found.value) return found.value;
		}
	}
	return null;
}

function wizardFilterVisibleAtIndex(fIdx, merged) {
	var f = wizardState.filters[fIdx];
	if (!f || !f.visibleWhen) return true;
	var conditions = f.visibleWhen;
	for (var parentId in conditions) {
		if (!conditions.hasOwnProperty(parentId)) continue;
		var allowedValues = conditions[parentId];
		var parentValues = merged[parentId];
		if (!parentValues || !Array.isArray(parentValues) || parentValues.length === 0) return false;
		var hasMatch = parentValues.some(function(pv) {
			return allowedValues.indexOf(pv.name) !== -1 || allowedValues.indexOf(pv.value) !== -1;
		});
		if (!hasMatch) return false;
	}
	return true;
}

function ensureVisibleWhenChainForTarget(merged, targetIdx) {
	var f = wizardState.filters[targetIdx];
	if (!f || !f.visibleWhen) return;
	for (var parentId in f.visibleWhen) {
		if (!f.visibleWhen.hasOwnProperty(parentId)) continue;
		var parentIdx = wizardState.filters.findIndex(function(x) { return x.id === parentId; });
		if (parentIdx >= 0) ensureVisibleWhenChainForTarget(merged, parentIdx);
		var allowed = f.visibleWhen[parentId];
		var cur = merged[parentId];
		var hasVal = cur && Array.isArray(cur) && cur.length > 0 && !cur.some(function(s) { return s.name === 'All' || s.value === '*'; });
		if (!hasVal && allowed && allowed.length > 0) {
			var pick = allowed[0];
			merged[parentId] = [{ id: pick, name: pick, value: pick }];
		}
	}
}

function buildMergedPreviewFilterState(targetIdx) {
	var merged = {};
	var raw = window.parentFilterStateValues;
	if (raw && typeof raw === 'object') {
		for (var k in raw) {
			if (!raw.hasOwnProperty(k)) continue;
			merged[k] = raw[k];
		}
	}
	ensureVisibleWhenChainForTarget(merged, targetIdx);
	var rt = generateRuntimeConfig().filters;
	for (var i = 0; i < targetIdx; i++) {
		var wf = wizardState.filters[i];
		var rf = rt[i];
		if (!wf || !wf.hidden || wf.source !== 'api' || !rf.valuePropertyName) continue;
		var cur = merged[wf.id];
		var hasReal = cur && Array.isArray(cur) && cur.length > 0 && !cur.some(function(s) { return s.name === 'All' || s.value === '*'; });
		if (hasReal) continue;
		var pre = wf.preselectedValues;
		if (pre && pre.length > 0) {
			merged[wf.id] = pre.map(function(v) { return { id: v, name: v, value: v }; });
		} else {
			merged[wf.id] = [{ id: '*', name: 'All', value: '*' }];
		}
	}
	return merged;
}

function deviceMatchesWizardUpstream(item, upToIndex, runtimeFilters, merged) {
	for (var ui = 0; ui < upToIndex; ui++) {
		var uf = runtimeFilters[ui];
		if (!wizardFilterVisibleAtIndex(ui, merged)) continue;
		if (uf.source === 'static' || !uf.valuePropertyName) continue;
		var sel = merged[uf.id];
		if (!sel || !Array.isArray(sel) || sel.length === 0) continue;
		var hasAll = sel.some(function(s) { return s.name === 'All' || s.value === '*'; });
		if (hasAll) continue;
		var selectedValues = sel.map(function(s) { return s.value; });
		var isExclude = uf.filterMode === 'exclude';
		var propVal = findPropertyWizard(item, uf.valuePropertyName);
		if (!propVal) {
			if (isExclude) continue;
			return false;
		}
		var vals = uf.delimiter ? propVal.split(uf.delimiter) : [propVal];
		if (isExclude) {
			for (var ve = 0; ve < vals.length; ve++) {
				var ev = vals[ve].trim();
				if (!ev) continue;
				if (uf.valueFilter && !applyTransformWizard(ev, uf.valueFilter)) continue;
				if (uf.valueTransform) ev = applyTransformWizard(ev, uf.valueTransform);
				if (selectedValues.indexOf(ev) !== -1) return false;
			}
			continue;
		}
		var matched = false;
		for (var vi = 0; vi < vals.length; vi++) {
			var v = vals[vi].trim();
			if (!v) continue;
			if (uf.valueFilter && !applyTransformWizard(v, uf.valueFilter)) continue;
			if (uf.valueTransform) v = applyTransformWizard(v, uf.valueTransform);
			if (selectedValues.indexOf(v) !== -1) { matched = true; break; }
		}
		if (!matched) return false;
	}
	return true;
}

function getFilterValues(idx) {
	var f = wizardState.filters[idx];
	if (f.source === 'static') return (f.staticOptions || []).slice().sort();
	var propName = f.valuePropertyName;
	var devices = window.cachedDevices || [];
	if (!propName || devices.length === 0) return [];
	var runtimeFilters = generateRuntimeConfig().filters;
	var merged = buildMergedPreviewFilterState(idx);
	var rawValues = new Set();
	var propArrays = ['systemProperties','autoProperties','customProperties','inheritedProperties'];
	for (var d = 0; d < devices.length; d++) {
		var dev = devices[d];
		if (!deviceMatchesWizardUpstream(dev, idx, runtimeFilters, merged)) continue;
		var foundRaw = null;
		for (var a = 0; a < propArrays.length; a++) {
			var arr = dev[propArrays[a]];
			if (!arr) continue;
			for (var p = 0; p < arr.length; p++) {
				if (arr[p].name === propName) { foundRaw = arr[p].value; break; }
			}
			if (foundRaw) break;
		}
		if (!foundRaw) continue;
		rawValues.add(foundRaw);
	}
	if (rawValues.size === 0) return [];
	if (f.extractionPreset === 'splitPick') {
		var cfg = f.extractionConfig || {};
		var extracted = new Set();
		rawValues.forEach(function(raw) {
			var parts = (cfg.multiSep) ? raw.split(cfg.multiSep) : [raw];
			parts.forEach(function(part) {
				part = part.trim();
				if (cfg.startsWithFilter && !part.startsWith(cfg.startsWithFilter)) return;
				var pieces = part.split(cfg.splitChar || '/');
				var picked = pieces[cfg.splitIndex || 0] || '';
				if (picked) extracted.add(picked);
			});
		});
		return Array.from(extracted).sort();
	}
	return Array.from(rawValues).sort();
}

function toggleVisibleWhenValue(filterIndex, parentId, value, checked) {
	var f = wizardState.filters[filterIndex];

function handleVisibleWhenTagKeydown(e, filterIndex, parentId) {
	if (e.key === 'Enter' && e.target.value.trim()) {

		if (!f.visibleWhen) f.visibleWhen = {};

function escapeJsStr(s) {
	// Escape characters that break single-quoted JS string literals
	return String(s || '').replace(/\\\\/g, '\\\\\\\\').replace(/'/g, "\\\\'");
}



// Build runtime extraction fields from the user-friendly extraction preset
function buildExtractionFields(f) {
	var result = { delimiter: '', valueFilter: '', valueTransform: '', globPattern: f.globPattern || '' };
	var preset = f.extractionPreset || 'direct';
	var cfg = f.extractionConfig || {};

	if (preset === 'direct') {
		// No extraction — use raw value as-is
	} else if (preset === 'splitPick') {
		var ch = cfg.splitChar || '/';
		var idx = cfg.splitIndex || 0;
		// Multi-value separator
		if (cfg.multiSep) result.delimiter = cfg.multiSep;
		// Starts-with filter
		if (cfg.startsWithFilter) result.valueFilter = "value.startsWith('" + escapeJsStr(cfg.startsWithFilter) + "')";
		// Split + pick
		result.valueTransform = "value.split('" + escapeJsStr(ch) + "')[" + idx + "] || ''";
		// Auto-generate globPattern for path properties used in URL
		if (!f.globPattern && f.property === f.valuePropertyName && cfg.startsWithFilter) {
			var pattern = cfg.startsWithFilter;
			var prefixDepth = cfg.startsWithFilter.split(ch).length;
			var wildcardCount = Math.max(0, idx - prefixDepth);
			for (var i = 0; i < wildcardCount; i++) pattern += '/*';
			pattern += '/\\\${value}*';
			result.globPattern = pattern;
		}
	}
	return result;
}

function generateRuntimeConfig() {
	const filters = wizardState.filters.map(f => {
		const runtime = {
			id: f.id || generateId(f.label),
			label: f.label,
			placeholder: f.placeholder,
			property: f.property,
			source: f.source,
			includeAll: f.includeAll,
			allValue: f.allValue || '*',
			multiSelect: f.multiSelect !== false
		};

		if (f.source === 'api') {
			if (f.valuePropertyName) runtime.valuePropertyName = f.valuePropertyName;
			var ext = buildExtractionFields(f);
			if (ext.delimiter) runtime.delimiter = ext.delimiter;
			if (ext.valueFilter) runtime.valueFilter = ext.valueFilter;
			if (ext.valueTransform) runtime.valueTransform = ext.valueTransform;
			if (ext.globPattern) runtime.globPattern = ext.globPattern;
		} else if (f.source === 'static') {
			runtime.staticOptions = f.staticOptions || [];
		}

		// Manual globPattern override (only if not already set by extraction preset)
		if (f.globPattern && !runtime.globPattern) runtime.globPattern = f.globPattern;

		// Conditional visibility
		if (f.visibleWhen && Object.keys(f.visibleWhen).length > 0) {
			runtime.visibleWhen = JSON.parse(JSON.stringify(f.visibleWhen));
		}

		if (f.hidden) runtime.hidden = true;
		if (f.filterMode === 'exclude') runtime.filterMode = 'exclude';
		if (Array.isArray(f.preselectedValues) && f.preselectedValues.length > 0) runtime.preselectedValues = f.preselectedValues.slice();

		// Copy _wizard metadata for round-tripping
		runtime._wizard = {
			extractionPreset: f.extractionPreset,
			extractionConfig: f.extractionConfig
		};

		return runtime;
	});

	return { filters: filters, maxResults: 1000 };
}

async function saveWizard() {
	const runtimeConfig = generateRuntimeConfig();
	let localSuccess = false;

	try {
		try {
			if (parentWidget && !parentWidget.closed && parentWidget.applyConfigFromPopup) {
				parentWidget.applyConfigFromPopup(runtimeConfig, wizardState);
			}
		} catch (e) { console.warn('Could not update parent widget UI:', e); }

		localStorage.setItem('filterWidgetV7Config', JSON.stringify(runtimeConfig));
		localStorage.setItem('filterWidgetV7WizardState', JSON.stringify(wizardState));
		localSuccess = true;
	} catch (e) {
		showWizardMessage('Failed to save: ' + e.message, 'error');
		return false;
	}

	showWizardMessage('Saving configuration to widget source…', 'info');

	try {
		if (parentWidget && !parentWidget.closed && parentWidget.saveConfigToWidgetSource) {
			await parentWidget.saveConfigToWidgetSource(runtimeConfig);
			showWizardMessage('Configuration saved to widget source. Dashboard will reload…', 'success');
			setTimeout(function() {
				try { parentWidget.location.reload(); } catch(e) {}
				window.close();
			}, 1500);
		} else {
			showWizardMessage('Configuration saved locally. Widget source update unavailable — open in a LogicMonitor dashboard to persist for all users.', 'warning');
		}
	} catch (e) {
		console.warn('Widget source update failed:', e);
		showWizardMessage('Saved locally only — could not update widget source: ' + e.message, 'warning');
	}

	return localSuccess;
}

async function saveAndCloseWizard() {
	await saveWizard();
}

	return String(str).replace(/&/g, '&').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;');

	// ============================================================================
	// INITIALIZATION
	// ============================================================================
	async function initializeFilters()
	{
		// ── PHASE 0: Restore static filter values from localStorage ──
		try
		{
			const saved = localStorage.getItem('filterWidgetV7State');
			if (saved)
			{
				const savedState = JSON.parse(saved);
				if (savedState && savedState.values)
				{
					FILTER_CONFIG.filters.forEach(f =>
					{
						if (f.source === 'static' && savedState.values[f.id])
						{
							const sv = savedState.values[f.id];
							filterState.values[f.id] = Array.isArray(sv) ? sv : [sv];
						}
					});
				}
			}
		}
		catch (e)
		{
			console.warn('Failed to restore static filter state:', e);
		}

		// ── PHASE 1: Instant restore — show last-known values immediately ──
		const urlFilters = parseFiltersFromURL();
		if (urlFilters)
		{
			FILTER_CONFIG.filters.forEach(f =>
			{
				const rawValues = urlFilters[f.id];
				if (!rawValues || rawValues.length === 0) return;
				if (rawValues.length === 1 && (rawValues[0] === 'All' || rawValues[0] === '*'))
				{
					filterState.values[f.id] = [
					{
						id: '*',
						name: 'All',
						value: '*'
					}];
				}
				else
				{
					filterState.values[f.id] = rawValues.filter(v => v !== 'All' && v !== '*').map(rawValue =>
					{
						const displayName = getDisplayName(f.id, rawValue);
						return {
							id: rawValue,
							name: displayName,
							value: rawValue
						};
					});
				}
			});
			renderFilters();
			FILTER_CONFIG.filters.forEach(f => updateFilterDisplay(f.id));
			updateStatusStrip();
		}
		else
		{
			loadFilterState();
			renderFilters();
			FILTER_CONFIG.filters.forEach(f => updateFilterDisplay(f.id));
		}

		// ── PHASE 2: Background cache refresh — load fresh options from API ──
		sharedDeviceCache.clear();
		await warmDeviceCache();

		const visibleFilters = getVisibleFilters();
		for (let vi = 0; vi < visibleFilters.length; vi++)
		{
			const f = visibleFilters[vi];
			const globalIndex = FILTER_CONFIG.filters.findIndex(cf => cf.id === f.id);
			await loadFilterData(globalIndex, true);

			if (f.hidden)
			{
				autoSelectHiddenFilter(f.id);
			}
			else if (urlFilters)
			{
				const rawValues = urlFilters[f.id];
				if (rawValues && rawValues.length > 0 && !(rawValues.length === 1 && (rawValues[0] === 'All' || rawValues[0] === '*')))
				{
					const options = filterState.options[f.id] || [];
					const normalizeValue = (v) => v ? v.trim().replace(/\/+$/, '') : '';
					const matchedOptions = [];
					rawValues.forEach(rawValue =>
					{
						if (rawValue === 'All' || rawValue === '*') return;
						const normalizedRaw = normalizeValue(rawValue);
						let matchedOption = options.find(opt => normalizeValue(opt.value) === normalizedRaw);
						if (!matchedOption)
						{
							const displayName = getDisplayName(f.id, rawValue); matchedOption = options.find(opt => opt.name === displayName);
						}
						if (!matchedOption)
						{
							matchedOption = options.find(opt =>
							{
								const optVal = normalizeValue(opt.value); return optVal.endsWith(normalizedRaw) || normalizedRaw.endsWith(optVal);
							});
						}
						if (!matchedOption)
						{
							const lastSegment = normalizedRaw.split('/').pop(); matchedOption = options.find(opt =>
							{
								const optLastSegment = normalizeValue(opt.value).split('/').pop(); return optLastSegment === lastSegment || opt.name === lastSegment;
							});
						}
						if (matchedOption) matchedOptions.push(matchedOption);
					});
					if (matchedOptions.length > 0)
					{
						filterState.values[f.id] = matchedOptions;
						updateFilterDisplay(f.id);
						updateDropdownCheckmarks(f.id);
					}
				}
			}
			else
			{
				applyPreselectedDefaults(f.id);
				updateFilterDisplay(f.id);
				updateDropdownCheckmarks(f.id);
			}
		}
		updateStatusStrip();
	}
